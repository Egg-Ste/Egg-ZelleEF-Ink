Object.assign(CARDS, {
  osmoreg:{t:'Osmoregulation', q:'Wie halten Fische ihren Salzhaushalt im Gleichgewicht?', a:'<p><strong>Osmoregulation</strong> ist die Regulation des Wasser- und Salzgehalts von Körperflüssigkeiten. <strong>Meeresfische</strong> verlieren im hypertonischen Meer Wasser: Sie trinken und scheiden Salz <strong>aktiv über die Kiemen</strong> aus, wenig konzentrierter Urin. <strong>Süßwasserfische</strong> nehmen ständig Wasser auf: Sie trinken nicht, scheiden viel verdünnten Urin aus und nehmen Salz aktiv über die Kiemen auf.</p>', fig:'fish'},
  homoeo:{t:'Homöostase', q:'Warum muss das „innere Meer“ konstant bleiben?', a:'<p><strong>Homöostase</strong> ist die Aufrechterhaltung eines konstanten inneren Milieus (z. B. Salzgehalt, Wassergehalt, Temperatur) trotz schwankender Umwelt. Für die Zellen ist das lebenswichtig: Ändert sich die Konzentration der Körperflüssigkeit, strömt Wasser osmotisch in oder aus den Zellen – sie schwellen an oder schrumpfen und können ihre Funktion verlieren. Regulation erfolgt über Rückkopplung: Abweichung vom Sollwert → Gegenmaßnahme.</p>'},
  salzdruese:{t:'Salzdrüsen & Nieren', q:'Wie werden Seevögel das Meersalz los?', a:'<p>Der Mensch reguliert Salz und Wasser nur über die <strong>Nieren</strong>. Um das Salz aus 2 Litern Meerwasser auszuscheiden, wären 3 Liter Urin nötig – Meerwasser macht durstig. <strong>Möwen</strong> besitzen zusätzlich <strong>Salzdrüsen</strong> über den Augen, die unter Energieaufwand eine konzentrierte Salzlösung ausscheiden. Salzpflanzen wie der Queller haben ebenfalls Salzdrüsen.</p>'},
  turgor:{t:'Turgor & Spaltöffnungen', q:'Wie öffnet eine Pflanze ihre Spaltöffnungen?', a:'<p>Ionen werden <strong>aktiv</strong> aus den Nebenzellen in die Vakuolen der <strong>Schließzellen</strong> gepumpt, Wasser folgt osmotisch, der <strong>Turgor</strong> steigt. Weil die Zellwand zum Spalt hin verdickt ist, krümmen sich die Zellen und der Spalt öffnet sich. Zum Schließen strömen Ionen zurück, Wasser folgt, der Turgor sinkt.</p>', fig:'stomata'},
  euryhalin:{t:'Euryhalin & Brackwasser', q:'Wer überlebt im wechselnd salzigen Wasser?', a:'<p><strong>Euryhaline</strong> Arten (z. B. Strandkrabbe, Lachs) tolerieren stark schwankende Salzgehalte. Im <strong>Brackwasser</strong> von Flussmündungen müssen sie ihre Osmoregulation ständig anpassen – etwa durch eine veränderte Harnproduktion. Stenohaline Arten vertragen nur geringe Schwankungen.</p>'}
});

    .replace(/[‐-―\-\/]/g,' ').replace(/[^a-z0-9,.% ]+/g,' ').replace(/\s+/g,' '); }

function lev(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>1) return 2; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }

function runQuiz(host, list, opts){
  let k=0; const results=[];
  const step=()=>{
    if(k>=list.length) return opts.onDone(results);
    const {item,id}=list[k];
    host.innerHTML=`<div class="quiz panel"><div class="q-top"><span class="lv lv${item.lvl||1}">${LEVELNAMES[item.lvl||1]}</span><span>Aufgabe ${k+1} von ${list.length}</span><span class="dots">${list.map((x,i)=>`<i class="${i<k?(results[i].score===1?'d-ok':'d-bad'):i===k?'d-cur':''} l${x.item.lvl||1}"></i>`).join('')}</span></div>
      <div class="q-body"></div><div class="item-help"></div><div class="fb" aria-live="polite"></div>
      <div class="q-actions">${item.tip||item.hint?'<button class="btn ghost small tipbtn">Tipp</button>':''}${item.card?'<button class="btn ghost small cardbtn">Infokarte</button>':''}<button class="btn" id="chk">Prüfen</button></div></div>`;
    const body=$('.q-body',host); const ctl=R[item.type](item,body);
    const tb=$('.tipbtn',host); if(tb) tb.addEventListener('click',()=>{ $('.item-help',host).innerHTML=`<p class="tipbox"><strong>Tipp:</strong> ${esc(item.tip||item.hint)}</p>`; tb.disabled=true; });
    const cb=$('.cardbtn',host); if(cb) cb.addEventListener('click',()=>openCard(item.card));
    $('#chk',host).addEventListener('click',function(){
      if(this.dataset.next){ k++; host.scrollIntoView({block:'start',behavior:RM?'auto':'smooth'}); return step(); }
      if(!ctl.ready()){ $('.fb',host).innerHTML='<p class="fb-note">Beantworte zuerst die Aufgabe.</p>'; return; }
      body.dataset.done='1'; const r=ctl.check(); results.push({id,score:r.score,cid:list[k].cid,lvl:item.lvl||1}); if(r.score===1) markSolved(id);
      $('.fb',host).innerHTML=`<div class="fb-box ${r.score===1?'good':r.score>=.5?'mid':'low'}"><p class="fb-title">${r.score===1?'Alles richtig.':r.score>=.5?`Teilweise richtig (${Math.round(r.score*100)} %).`:'Das sitzt noch nicht.'}</p>${r.html||''}${r.score<1&&item.card?`<p><button class="linkbtn fbcard">Infokarte „${esc(CARDS[item.card].t)}“ ansehen</button></p>`:''}</div>`;
      const fc=$('.fbcard',host); if(fc) fc.addEventListener('click',()=>openCard(item.card));
      this.textContent=k<list.length-1?'Weiter':'Auswertung'; this.dataset.next='1'; this.focus();
    });
  };
  step();
}

/* ---------- Klausuraufgaben mit gestuften Hilfen ---------- */
function evalTask(task,text){ const n=norm(text);
  const res=task.crit.map(c=>{ let ok; if(c.some) ok=c.some.filter(k=>n.includes(nk(k))).length>=(c.min||1); else ok=c.all.every(g=>g.some(k=>n.includes(nk(k)))); return {c,ok}; });
  return {res, pts:res.reduce((a,r)=>a+(r.ok?r.c.p:0),0)}; }
function opChip(op){ return `<button type="button" class="op" aria-expanded="false">${esc(op)}</button><span class="op-help" hidden>${esc(OPERATORS[op]||'')}</span>`; }
function taskCard(ch,task,i,tid,mode){
  const saved=S.answers[tid]||'';
  return `<article class="task panel" data-tid="${tid}" data-i="${i}">
    <header class="task-head"><div class="op-wrap">${opChip(task.op)}${task.afb?`<span class="afb" title="Anforderungsbereich">AFB ${task.afb}</span>`:''}</div><span class="pts">${task.p} Punkte</span></header>
    <p class="task-q">${esc(task.q)}</p>
    ${task.fig?`<figure class="slide q-fig">${fig(task.fig)}</figure>`:''}
    ${task.hilfen&&mode!=='probe'?`<div class="hilfen"><span class="h-l">Gestufte Hilfen:</span>${task.hilfen.map((h,k)=>`<button type="button" class="hbtn" data-h="${k}" ${k>0?'disabled':''}>Hilfe ${k+1}</button>`).join('')}<div class="hbox" aria-live="polite"></div></div>`:''}
    <label class="sr" for="ta-${tid}">Deine Antwort</label>
    <textarea id="ta-${tid}" rows="7" placeholder="Schreibe deine Antwort in ganzen Sätzen und mit Fachbegriffen …">${esc(saved)}</textarea>
    <div class="task-bar"><span class="wc">${saved.trim()?saved.trim().split(/\s+/).length:0} Wörter</span>
      <div class="row"><button type="button" class="btn ghost small solbtn" ${S.best[tid]!==undefined?'':'disabled'} ${mode==='probe'?'hidden':''}>Musterlösung</button><button type="button" class="btn small chkbtn">Antwort prüfen</button></div></div>
    <div class="task-fb" aria-live="polite"></div>
    <div class="sol" hidden><h4>Musterlösung</h4>${task.solutionFig?`<figure class="slide q-fig">${fig(task.solutionFig)}</figure>`:''}<p>${esc(task.model)}</p><h4>Erwartungshorizont</h4><ul>${task.crit.map(c=>`<li>${esc(c.t)} <span class="muted">(${c.p} P.)</span></li>`).join('')}</ul></div>
  </article>`;
}
function bindTask(card,task,onScore){
  const tid=card.dataset.tid, ta=$('textarea',card);
  $$('.op',card).forEach(b=>b.addEventListener('click',()=>{ const h=b.nextElementSibling; h.hidden=!h.hidden; b.setAttribute('aria-expanded',String(!h.hidden)); }));
  $$('.hbtn',card).forEach(b=>b.addEventListener('click',()=>{ const k=+b.dataset.h; const names=['Denkanstoß','Struktur & Fachbegriffe','Satzanfänge'];
    $('.hbox',card).insertAdjacentHTML('beforeend',`<p class="hstep"><strong>${names[k]}:</strong> ${esc(task.hilfen[k])}</p>`); b.disabled=true; b.classList.add('used'); const n=$(`.hbtn[data-h="${k+1}"]`,card); if(n) n.disabled=false; }));
  ta.addEventListener('input',()=>{ S.answers[tid]=ta.value; save(); const w=ta.value.trim()?ta.value.trim().split(/\s+/).length:0; $('.wc',card).textContent=`${w} Wörter`; });
  $('.chkbtn',card).addEventListener('click',()=>{
    const text=ta.value.trim(), fb=$('.task-fb',card);
    if(text.split(/\s+/).length<5){ fb.innerHTML='<p class="fb-note">Schreib zuerst eine Antwort – mindestens ein, zwei ganze Sätze.</p>'; return; }
    const {res,pts}=evalTask(task,text), words=text.split(/\s+/).length, pct=pts/task.p;
    fb.innerHTML=`<div class="fb-box ${pct>=.8?'good':pct>=.5?'mid':'low'}"><p class="fb-title">Check: ca. ${pts} von ${task.p} Punkten</p>
      <ul class="crit">${res.map(r=>`<li class="${r.ok?'c-ok':'c-miss'}"><span aria-hidden="true">${r.ok?'✓':'○'}</span> ${r.ok?'':'<em>Fehlt noch:</em> '}${esc(r.c.t)}</li>`).join('')}</ul>
      ${words<25?'<p class="fb-note">Deine Antwort ist sehr kurz. In der Klausur zählen vollständige Sätze mit Begründung.</p>':''}
      ${task.op==='Vergleichen'?'<p class="fb-note">Beim Vergleichen immer Gemeinsamkeiten und Unterschiede nennen.</p>':''}
      <p class="fb-small">Der Check sucht nach Fachbegriffen und Kernaussagen. Ob deine Sätze fachlich stimmen, prüft er nicht – vergleiche mit der Musterlösung und überarbeite.</p></div>`;
    onScore&&onScore(tid,pts); const sb=$('.solbtn',card); if(sb) sb.disabled=false;
  });
  const sb=$('.solbtn',card); if(sb) sb.addEventListener('click',()=>{ const s=$('.sol',card); s.hidden=!s.hidden; sb.textContent=s.hidden?'Musterlösung':'Musterlösung ausblenden'; });
}

Object.assign(CARDS, {
  zmembran:{t:'Zellmembran', q:'Was trennt die Zelle von ihrer Umgebung?', a:'<p>Die <strong>Zellmembran</strong> (Plasmamembran) begrenzt das Cytoplasma. Sie ist eine Lipid-Doppelschicht mit eingelagerten Proteinen, <strong>semipermeabel</strong> und durch Kanäle und Carrier <strong>selektiv permeabel</strong>. In der Pflanzenzelle liegt sie innen an der Zellwand.</p>'},
  vesikel:{t:'Vesikel', q:'Wie reisen Proteine durch die Zelle?', a:'<p><strong>Vesikel</strong> sind kleine, von Membran umhüllte Bläschen. Sie schnüren sich vom ER oder Golgi-Apparat ab, wandern entlang des Cytoskeletts und verschmelzen mit ihrem Ziel – z. B. der Zellmembran (Exocytose).</p>'},
  cholesterin:{t:'Cholesterin', q:'Was macht Cholesterin in der Membran?', a:'<p><strong>Cholesterin</strong> lagert sich zwischen die Phospholipide tierischer Membranen. Es stabilisiert die Membran und reguliert ihre Fluidität: Bei Wärme macht es sie fester, bei Kälte verhindert es, dass sie zu starr wird. In Lipid-Rafts ist es angereichert.</p>'},
  aquaporin:{t:'Aquaporine', q:'Wie gelangt Wasser schnell durch die Membran?', a:'<p><strong>Aquaporine</strong> sind Kanalproteine, die Wassermoleküle in einer Reihe durch die Membran lassen – bis zu Milliarden pro Sekunde. In der Niere ermöglichen sie die Rückgewinnung von Wasser. Für ihre Entdeckung gab es 2003 den Nobelpreis für Chemie (Peter Agre).</p>'}
});

const M3 = (()=>{
  const spriteCache = {};
  function hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
  function sprite(col){ if(spriteCache[col]) return spriteCache[col];
    const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d'); const [r,gg,b]=hex2rgb(col);
    const L=(k)=>`rgb(${Math.min(255,r+(255-r)*k)|0},${Math.min(255,gg+(255-gg)*k)|0},${Math.min(255,b+(255-b)*k)|0})`, D=(k)=>`rgb(${r*k|0},${gg*k|0},${b*k|0})`;
    const gr=g.createRadialGradient(24,22,2,32,32,31); gr.addColorStop(0,L(.7)); gr.addColorStop(.35,col); gr.addColorStop(1,D(.45));
    g.fillStyle=gr; g.beginPath(); g.arc(32,32,31,0,7); g.fill(); spriteCache[col]=c; return c; }

  class View {
    constructor(host, opt){
      this.opt=Object.assign({h:480, D:560, rx:-.35, ry:.6, auto:true, bg:null},opt||{});
      this.host=host; host.classList.add('m3d');
      host.innerHTML=`<canvas tabindex="0" aria-label="${esc(this.opt.label||'Drehbares 3D-Modell')}. Mit Maus, Finger oder Pfeiltasten drehen."></canvas><div class="m3d-tip" hidden></div><div class="m3d-hint">Ziehen zum Drehen</div>`;
      this.cv=$('canvas',host); this.ctx=this.cv.getContext('2d'); this.tip=$('.m3d-tip',host);
      this.S=[]; this.L=[]; this.T=[]; this.names={}; this.rx=this.opt.rx; this.ry=this.opt.ry; this.zoom=1; this.cut=false; this.hidden=new Set(); this.hl=null; this.hover=null;
      this.drag=null; this.lastUser=0; this.t0=performance.now(); this.onPick=null; this.update=null; this.target=null;
      this.resize(); this._ro=new ResizeObserver(()=>this.resize()); this._ro.observe(host);
      const cv=this.cv;
      cv.addEventListener('pointerdown',e=>{ this.drag={x:e.clientX,y:e.clientY,moved:0}; cv.setPointerCapture(e.pointerId); this.lastUser=performance.now(); $('.m3d-hint',host).classList.add('gone'); });
      cv.addEventListener('pointermove',e=>{ const r=cv.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top;
        if(this.drag){ const dx=e.clientX-this.drag.x, dy=e.clientY-this.drag.y; this.drag.moved+=Math.abs(dx)+Math.abs(dy); this.ry+=dx*0.009; this.rx=Math.max(-1.55,Math.min(1.55,this.rx+dy*0.009)); this.drag.x=e.clientX; this.drag.y=e.clientY; this.lastUser=performance.now(); this.target=null; }
        else { const p=this.pick(mx,my); this.hover=p; cv.style.cursor=p?'pointer':'grab'; if(p&&this.names[p]){ this.tip.hidden=false; this.tip.textContent=this.names[p].t; this.tip.style.left=mx+'px'; this.tip.style.top=my+'px'; } else this.tip.hidden=true; } });
      cv.addEventListener('pointerup',e=>{ const r=cv.getBoundingClientRect(); if(this.drag && this.drag.moved<6){ const p=this.pick(e.clientX-r.left,e.clientY-r.top); if(p&&this.onPick) this.onPick(p); } this.drag=null; });
      cv.addEventListener('pointerleave',()=>{ this.tip.hidden=true; this.hover=null; });
      cv.addEventListener('keydown',e=>{ const k=e.key; if(k==='ArrowLeft'){this.ry-=.15;} else if(k==='ArrowRight'){this.ry+=.15;} else if(k==='ArrowUp'){this.rx=Math.max(-1.55,this.rx-.15);} else if(k==='ArrowDown'){this.rx=Math.min(1.55,this.rx+.15);} else if(k==='+'){this.zoomBy(1.15);} else if(k==='-'){this.zoomBy(1/1.15);} else return; e.preventDefault(); this.lastUser=performance.now(); });
      const loop=(t)=>{ this.frame(t); this.raf=requestAnimationFrame(loop); }; this.raf=requestAnimationFrame(loop);
      CLEANUP.push(()=>this.destroy());
    }
    destroy(){ cancelAnimationFrame(this.raf); this._ro && this._ro.disconnect(); }
    resize(){ const w=this.host.clientWidth||600; const h=Math.min(this.opt.h, Math.max(300, w*0.78)); const dpr=Math.min(2,window.devicePixelRatio||1);
      this.W=w; this.H=h; this.cv.width=w*dpr; this.cv.height=h*dpr; this.cv.style.height=h+'px'; this.ctx.setTransform(dpr,0,0,dpr,0,0); }
    zoomBy(f){ this.zoom=Math.max(.55,Math.min(3.2,this.zoom*f)); this.lastUser=performance.now(); }
    setView(rx,ry){ this.target={rx,ry}; this.lastUser=performance.now(); }
    project(x,y,z){ const cy=Math.cos(this.ry), sy=Math.sin(this.ry), cx=Math.cos(this.rx), sx=Math.sin(this.rx);
      const x1=x*cy+z*sy, z1=-x*sy+z*cy, y1=y*cx-z1*sx, z2=y*sx+z1*cx; const dep=z2+this.opt.D; const F=this.opt.D*this.zoom*Math.min(this.W,this.H)/(this.opt.fit||440);
      const s=F/dep; return [this.W/2+x1*s, this.H/2-y1*s, z2, s, dep]; }
    frame(t){
      const now=performance.now();
      if(this.target){ this.rx+=(this.target.rx-this.rx)*.1; let d=this.target.ry-this.ry; this.ry+=d*.1; if(Math.abs(this.target.rx-this.rx)<.002&&Math.abs(d)<.002) this.target=null; }
      else if(this.opt.auto && !this.drag && now-this.lastUser>3500 && !RM) this.ry+=0.0028;
      if(this.update) this.update(now-this.t0);
      const c=this.ctx; c.clearRect(0,0,this.W,this.H);
      const items=[]; const cut=this.cut, hl=this.hl, hid=this.hidden;
      for(const s of this.S){ if(hid.has(s.g)) continue; const p=this.project(s.x,s.y,s.z); if(p[4]<30) continue; if(cut && s.cut && p[2]<-4) continue; items.push({k:0,o:s,p,d:p[4]}); }
      for(const l of this.L){ if(hid.has(l.g)) continue; const a=this.project(l.x1,l.y1,l.z1), b=this.project(l.x2,l.y2,l.z2); if(cut && l.cut && (a[2]+b[2])/2<-4) continue; items.push({k:1,o:l,a,b,d:(a[4]+b[4])/2}); }
      items.sort((u,v)=>v.d-u.d);
      this.drawn=items;
      for(const it of items){ const o=it.o; let al=o.a==null?1:o.a; const dim = hl && o.g!==hl; const hov = this.hover && o.g===this.hover && !hl;
        if(dim) al*=.13; if(hov) al=Math.min(1,al+.35);
        if(it.k===0){ const r=Math.max(.7,o.r*it.p[3])*(hl&&o.g===hl?1.12:1); c.globalAlpha=al; c.drawImage(sprite(o.c), it.p[0]-r, it.p[1]-r, 2*r, 2*r); }
        else { c.globalAlpha=al; c.strokeStyle=o.c; c.lineWidth=Math.max(.6,(o.w||1)*it.a[3]); c.beginPath(); c.moveTo(it.a[0],it.a[1]); c.lineTo(it.b[0],it.b[1]); c.stroke(); } }
      c.globalAlpha=1;
      for(const tx of this.T){ const p=this.project(tx.x,tx.y,tx.z); c.font='600 13px Atkinson Hyperlegible, sans-serif'; const w=c.measureText(tx.text).width+16; c.fillStyle='rgba(6,18,31,.78)'; c.fillRect(p[0]-w/2,p[1]-11,w,22); c.fillStyle=tx.col||'#EAF6F7'; c.textAlign='center'; c.fillText(tx.text,p[0],p[1]+4.5); }
    }
    pick(mx,my){ if(!this.drawn) return null; for(let i=this.drawn.length-1;i>=0;i--){ const it=this.drawn[i]; if(it.k!==0) continue; const o=it.o; if(!this.names[o.g]) continue; if(this.hl && o.g!==this.hl) continue;
        const r=Math.max(4,o.r*it.p[3]); const dx=mx-it.p[0], dy=my-it.p[1]; if(dx*dx+dy*dy<=r*r) return o.g; } return null; }
  }

  /* Hilfsfunktionen für Geometrie */
  function fib(n){ const out=[]; const ga=Math.PI*(3-Math.sqrt(5)); for(let i=0;i<n;i++){ const y=1-(i/(n-1))*2, r=Math.sqrt(1-y*y), ph=i*ga; out.push([Math.cos(ph)*r,y,Math.sin(ph)*r]); } return out; }
  function norm3(v){ const l=Math.hypot(...v)||1; return v.map(x=>x/l); }
  function rotY(p,a){ const c=Math.cos(a),s=Math.sin(a); return [p[0]*c+p[2]*s,p[1],-p[0]*s+p[2]*c]; }
  function rotZ(p,a){ const c=Math.cos(a),s=Math.sin(a); return [p[0]*c-p[1]*s,p[0]*s+p[1]*c,p[2]]; }
  function rotX(p,a){ const c=Math.cos(a),s=Math.sin(a); return [p[0],p[1]*c-p[2]*s,p[1]*s+p[2]*c]; }

  /* ---------- Zellmodell ---------- */
  function buildCell(type){
    const rand=seeded(type==='plant'?77:42); const R=(a,b)=>a+rand()*(b-a);
    const S=[], L=[]; const add=(x,y,z,r,c,g,a,cut)=>S.push({x,y,z,r,c,g,a:a==null?1:a,cut:!!cut});
    const plant = type==='plant';
    const inside = plant ? (x,y,z,k)=> Math.pow(Math.abs(x/150),4)+Math.pow(Math.abs(y/90),4)+Math.pow(Math.abs(z/90),4) < (k||1)
                         : (x,y,z,k)=> (x/130)**2+(y/98)**2+(z/112)**2 < (k||1);
    const NC = plant?[118,10,32]:[18,8,0], NR = plant?22:34;
    const vac = (x,y,z)=> ((x+12)/112)**2+(y/64)**2+(z/64)**2;
    // Hülle
    if(plant){
      fib(1700).forEach(d=>{ const t=Math.pow(Math.pow(Math.abs(d[0]/150),4)+Math.pow(Math.abs(d[1]/90),4)+Math.pow(Math.abs(d[2]/90),4),-.25); add(d[0]*t,d[1]*t,d[2]*t,3,'#5FD38A','wand',.5,true); });
      fib(1200).forEach(d=>{ const t=.94*Math.pow(Math.pow(Math.abs(d[0]/150),4)+Math.pow(Math.abs(d[1]/90),4)+Math.pow(Math.abs(d[2]/90),4),-.25); add(d[0]*t,d[1]*t,d[2]*t,2.1,'#FF5A9E','membran',.45,true); });
      fib(1100).forEach(d=>add(-12+d[0]*112,d[1]*64,d[2]*64,2.5,'#6EC3FF','vakuole',.33,true));
      for(let i=0;i<7;i++){ const y=R(-50,50), z=R(-50,50); L.push({x1:142,y1:y,z1:z,x2:158,y2:y,z2:z,c:'#FFB0D0',w:1.6,g:'plasmo',a:.9}); add(150,y,z,2.4,'#FFB0D0','plasmo'); }
    } else {
      fib(1300).forEach(d=>add(d[0]*130,d[1]*98,d[2]*112,2.6,'#FF5A9E','membran',.5,true));
    }
    // Zellkern
    fib(plant?380:540).forEach(d=>{ if(rand()<.06) return; add(NC[0]+d[0]*NR,NC[1]+d[1]*NR,NC[2]+d[2]*NR,2.7,'#8E7CFF','kern',.92); });
    for(let i=0;i<60;i++){ const d=norm3([R(-1,1),R(-1,1),R(-1,1)]), r=R(0,NR*.75); add(NC[0]+d[0]*r,NC[1]+d[1]*r,NC[2]+d[2]*r,2,'#5E4BD6','kern'); }
    add(NC[0]+NR*.25,NC[1]-NR*.2,NC[2]+NR*.15,NR*.33,'#4B36D8','nucleolus');
    // raues ER
    const Dd = plant? norm3([-1,.2,-.4]) : norm3([-1,.25,.35]);
    (plant?[NR+9,NR+15]:[NR+10,NR+18,NR+26]).forEach(rr=>{ fib(plant?380:640).forEach(d=>{ const dot=d[0]*Dd[0]+d[1]*Dd[1]+d[2]*Dd[2]; if(dot<.28) return;
      const x=NC[0]+d[0]*rr,y=NC[1]+d[1]*rr,z=NC[2]+d[2]*rr; if(!inside(x,y,z,.9)) return; if(plant && vac(x,y,z)<1.05) return; add(x,y,z,2.1,'#FF8CC0','rer'); if(rand()<.45) add(NC[0]+d[0]*(rr+2.8),NC[1]+d[1]*(rr+2.8),NC[2]+d[2]*(rr+2.8),1.3,'#FFF0F6','rer'); }); });
    // Golgi
    const G = plant?[92,-44,-38]:[78,-34,26];
    for(let k=0;k<5;k++){ const Rk=(plant?15:20)-k*2.2; for(let u=-1;u<=1.001;u+=.14) for(let v=-1;v<=1.001;v+=.22){ if(u*u+v*v>1) continue; let p=[u*Rk, k*5.2+u*u*7-10, v*Rk*.55]; p=rotZ(p,.5); p=rotY(p,.4); add(G[0]+p[0],G[1]+p[1],G[2]+p[2],2.3,'#B58CFF','golgi'); } }
    // Mitochondrien
    const mitoPos = plant? [[40,55,50],[-40,-70,-40],[60,-62,52],[-90,55,-45]] : [[-80,30,-30],[-60,-50,40],[40,60,-50],[-20,-62,-58],[70,40,50],[-98,-12,50],[22,-58,66]];
    mitoPos.forEach((c,mi)=>{ const ax=norm3([R(-1,1),R(-1,1),R(-1,1)]); const pp=Math.abs(ax[0])<.9?[1,0,0]:[0,1,0];
      const u=norm3([ax[1]*pp[2]-ax[2]*pp[1],ax[2]*pp[0]-ax[0]*pp[2],ax[0]*pp[1]-ax[1]*pp[0]]); const w=[ax[1]*u[2]-ax[2]*u[1],ax[2]*u[0]-ax[0]*u[2],ax[0]*u[1]-ax[1]*u[0]];
      for(let t=-1;t<=1.001;t+=.18){ const rr=8*Math.sqrt(Math.max(0,1-t*t*.82)); for(let a=0;a<6.28;a+=.63){ const off=t*16; add(c[0]+ax[0]*off+(u[0]*Math.cos(a)+w[0]*Math.sin(a))*rr, c[1]+ax[1]*off+(u[1]*Math.cos(a)+w[1]*Math.sin(a))*rr, c[2]+ax[2]*off+(u[2]*Math.cos(a)+w[2]*Math.sin(a))*rr, 2.6,'#FFA552','mito'); } }
      for(let t=-.8;t<=.8;t+=.2) add(c[0]+ax[0]*t*16,c[1]+ax[1]*t*16,c[2]+ax[2]*t*16,3,'#C2652A','mito'); });
    // Lysosomen, Peroxisomen
    (plant?[[70,-60,60]]:[[-40,40,60],[60,-62,-30],[-70,60,10],[92,-20,-55],[-30,-76,12]]).forEach(p=>add(...p,6.5,'#FFD447','lyso'));
    (plant?[[50,60,-50],[-60,-60,55]]:[[50,20,-82],[-92,40,-40],[10,72,40],[96,25,-10]]).forEach(p=>add(...p,5,'#FF7FA8','perox'));
    // freie Ribosomen
    for(let i=0;i<(plant?130:230);i++){ const x=R(-140,140),y=R(-90,90),z=R(-100,100); if(!inside(x,y,z,.82)) continue; const dn=Math.hypot(x-NC[0],y-NC[1],z-NC[2]); if(dn<NR+30) continue; if(plant && vac(x,y,z)<1.08) continue; add(x,y,z,1.4,'#FFE3F0','ribo',.9); }
    // Chloroplasten
    if(plant){ let n=0, tries=0; while(n<16 && tries<400){ tries++; const d=fib(64)[Math.floor(rand()*64)]; const t=.8*Math.pow(Math.pow(Math.abs(d[0]/150),4)+Math.pow(Math.abs(d[1]/90),4)+Math.pow(Math.abs(d[2]/90),4),-.25);
        const c=[d[0]*t+R(-6,6),d[1]*t,d[2]*t]; if(vac(...c)<1.25) continue; if(Math.hypot(c[0]-NC[0],c[1]-NC[1],c[2]-NC[2])<NR+18) continue; n++;
        const ry=R(0,6.28), rz=R(0,6.28);
        fib(64).forEach(q=>{ let p=[q[0]*13,q[1]*5,q[2]*8]; p=rotZ(p,rz); p=rotY(p,ry); add(c[0]+p[0],c[1]+p[1],c[2]+p[2],2.4,'#6DDC5A','chloro'); });
        for(let k=-2;k<=2;k++){ let p=[k*4.5,0,0]; p=rotZ(p,rz); p=rotY(p,ry); add(c[0]+p[0],c[1]+p[1],c[2]+p[2],2.8,'#2F8F3A','chloro'); } } }
    // Centrosom
    if(!plant){ const Cc=[-12,-64,-25]; for(let k=0;k<5;k++) for(let a=0;a<6.28;a+=.8){ add(Cc[0]+k*3-6,Cc[1]+Math.cos(a)*3.2,Cc[2]+Math.sin(a)*3.2,1.8,'#D7D3F2','centro'); add(Cc[0]+8+Math.cos(a)*3.2,Cc[1]+Math.sin(a)*3.2,Cc[2]+k*3-6,1.8,'#D7D3F2','centro'); } }
    // Cytoskelett
    for(let i=0;i<(plant?14:26);i++){ const d=norm3([R(-1,1),R(-1,1),R(-1,1)]); let t=1; if(plant){ t=.9*Math.pow(Math.pow(Math.abs(d[0]/150),4)+Math.pow(Math.abs(d[1]/90),4)+Math.pow(Math.abs(d[2]/90),4),-.25); } else { t=.93/Math.sqrt((d[0]/130)**2+(d[1]/98)**2+(d[2]/112)**2); }
      L.push({x1:NC[0]+d[0]*(NR+4),y1:NC[1]+d[1]*(NR+4),z1:NC[2]+d[2]*(NR+4),x2:d[0]*t,y2:d[1]*t,z2:d[2]*t,c:'#9FE8FF',w:1,a:.2,g:'skelett'}); }
    // Vesikel (animiert)
    const ves=[]; for(let i=0;i<7;i++){ const s={x:0,y:0,z:0,r:4.4,c:'#D6C6FF',g:'vesikel',a:1}; S.push(s); ves.push(s); }
    const P0=[NC[0]+Dd[0]*(NR+22),NC[1]+Dd[1]*(NR+22),NC[2]+Dd[2]*(NR+22)];
    const exitDir = plant? norm3([.3,-.6,-.7]) : norm3([.8,-.5,.4]);
    let et; if(plant){ et=.92*Math.pow(Math.pow(Math.abs(exitDir[0]/150),4)+Math.pow(Math.abs(exitDir[1]/90),4)+Math.pow(Math.abs(exitDir[2]/90),4),-.25); } else et=.97/Math.sqrt((exitDir[0]/130)**2+(exitDir[1]/98)**2+(exitDir[2]/112)**2);
    const E=exitDir.map(v=>v*et);
    const bez=(a,b,c,t)=>a.map((_,i)=>(1-t)*(1-t)*a[i]+2*(1-t)*t*b[i]+t*t*c[i]);
    const mid1=[(P0[0]+G[0])/2,(P0[1]+G[1])/2-20,(P0[2]+G[2])/2+20], mid2=[(G[0]+E[0])/2,(G[1]+E[1])/2+10,(G[2]+E[2])/2];
    const update=(t)=>{ ves.forEach((s,i)=>{ let ph=((t/7000)+i/ves.length)%1; let p; if(ph<.5) p=bez(P0,mid1,G,ph*2); else p=bez(G,mid2,E,(ph-.5)*2); s.x=p[0]; s.y=p[1]; s.z=p[2]; }); };
    update(0);
    const names = {
      membran:{t:'Zellmembran',card:'zmembran'}, kern:{t:'Zellkern',card:'kern'}, nucleolus:{t:'Nucleolus',card:'kern'}, rer:{t:'raues ER',card:'er'},
      golgi:{t:'Golgi-Apparat (Dictyosomen)',card:'golgi'}, mito:{t:'Mitochondrium',card:'mito'}, lyso:{t:'Lysosom',card:'lyso'}, perox:{t:'Peroxisom',card:'perox'},
      ribo:{t:'freie Ribosomen',card:'ribosom'}, vesikel:{t:'Vesikel',card:'vesikel'}, centro:{t:'Centrosom',card:'skelett'}, skelett:{t:'Cytoskelett',card:'skelett'},
      wand:{t:'Zellwand',card:'wand'}, vakuole:{t:'Zentralvakuole',card:'vakuole'}, chloro:{t:'Chloroplast',card:'chloro'}, plasmo:{t:'Plasmodesmen',card:'wand'} };
    if(plant){ delete names.centro; } else { delete names.wand; delete names.vakuole; delete names.chloro; delete names.plasmo; }
    return {S,L,names,update};
  }

  /* ---------- Membranmodell ---------- */
  function buildMembrane(){
    const rand=seeded(9); const R=(a,b)=>a+rand()*(b-a);
    const S=[], L=[], T=[]; const prot=[];
    const P = { integral:{c:[-55,-40],r:22}, kanal:{c:[45,35],r:24}, carrier:{c:[62,-62],r:22} };
    const blocked=(x,z)=>Object.values(P).some(p=>Math.hypot(x-p.c[0],z-p.c[1])<p.r);
    const lip=[];
    for(let x=-108;x<=108.1;x+=12) for(let z=-108;z<=108.1;z+=12){ [1,-1].forEach(side=>{ const xx=x+R(-2,2), zz=z+R(-2,2); if(blocked(xx,zz)) return;
      const head={x:xx,y:side*25,z:zz,r:5.2,c:'#FF5A9E',g:'lipid'}; S.push(head);
      const t1={x1:0,y1:0,z1:0,x2:0,y2:0,z2:0,c:'#FFC56B',w:1.7,g:'tail',a:.95}, t2={...t1}; L.push(t1,t2);
      lip.push({h:head,t1,t2,bx:xx,bz:zz,side,ph:R(0,6.28),sp:R(.6,1.4)}); }); }
    const pr=(name,pts)=>{ const arr=pts.map(p=>{ const s={x:p[0],y:p[1],z:p[2],r:p[3],c:p[4],g:p[5]||name}; S.push(s); return s; }); prot.push({name,arr,base:arr.map(s=>[s.x,s.y,s.z]),ph:R(0,6.28)}); };
    // Integrales Protein (7 Helices) + Zuckerbaum
    let pts=[]; for(let k=0;k<7;k++){ const a=k/7*6.283; for(let y=-30;y<=30;y+=6) pts.push([P.integral.c[0]+Math.cos(a)*10,y,P.integral.c[1]+Math.sin(a)*10,5.2,'#A894FF']); }
    [[0,40,0],[0,47,0],[5,53,4],[-5,53,-4],[9,59,8],[-9,59,-8],[0,60,0]].forEach(p=>pts.push([P.integral.c[0]+p[0],p[1],P.integral.c[1]+p[2],3.6,'#FFD54D','glyko']));
    pr('integral',pts);
    // Kanal (Aquaporin)
    pts=[]; for(let k=0;k<8;k++){ const a=k/8*6.283; for(let y=-30;y<=30;y+=6) pts.push([P.kanal.c[0]+Math.cos(a)*13,y,P.kanal.c[1]+Math.sin(a)*13,5,'#59C7FF']); } pr('kanal',pts);
    // Carrier
    pts=[]; [-7,7].forEach(dx=>{ fib(34).forEach(d=>pts.push([P.carrier.c[0]+dx+d[0]*8,d[1]*28,P.carrier.c[1]+d[2]*10,4.6,'#7BE3A0'])); }); pr('carrier',pts);
    const glc={x:P.carrier.c[0],y:38,z:P.carrier.c[1],r:5,c:'#FFE08A',g:'carrier'}; S.push(glc);
    // Peripheres Protein
    pts=[]; fib(22).forEach(d=>pts.push([-20+d[0]*10,-38+d[1]*6,55+d[2]*10,4.6,'#C7B6FF'])); pr('peripher',pts);
    // Glykolipid
    [[90,32,80],[90,38,80],[94,44,83],[86,44,77]].forEach(p=>S.push({x:p[0],y:p[1],z:p[2],r:3.4,c:'#FFD54D',g:'glyko'}));
    // Cholesterin
    for(let i=0;i<22;i++){ const x=R(-100,100), z=R(-100,100); if(blocked(x,z)) continue; const side=rand()<.5?1:-1; S.push({x,y:side*15,z,r:2.6,c:'#FFB84D',g:'chol'},{x,y:side*10,z,r:2.2,c:'#FFB84D',g:'chol'}); }
    // Wasser durch den Kanal
    const wat=[]; for(let i=0;i<5;i++){ const o={x:P.kanal.c[0],y:0,z:P.kanal.c[1],r:3.4,c:'#FF6B6B',g:'wasser'}, h1={...o,r:2.1,c:'#F2F7FF'}, h2={...o,r:2.1,c:'#F2F7FF'}; S.push(o,h1,h2); wat.push([o,h1,h2]); }
    T.push({x:-110,y:62,z:-110,text:'außen (extrazellulär)',col:'#9FE8FF'},{x:-110,y:-62,z:-110,text:'innen (Cytoplasma)',col:'#FFB0D0'});
    const update=(t)=>{
      const tt=t/1000;
      lip.forEach(l=>{ const dx=Math.sin(tt*l.sp+l.ph)*1.6, dz=Math.cos(tt*l.sp*.8+l.ph)*1.6; const x=l.bx+dx, z=l.bz+dz, s=l.side;
        l.h.x=x; l.h.z=z; const wig=Math.sin(tt*2*l.sp+l.ph)*1.5;
        l.t1.x1=x-1.8; l.t1.y1=s*20; l.t1.z1=z; l.t1.x2=x-1.8+wig; l.t1.y2=s*2.5; l.t1.z2=z+.5;
        l.t2.x1=x+1.8; l.t2.y1=s*20; l.t2.z1=z; l.t2.x2=x+1.8-wig; l.t2.y2=s*2.5; l.t2.z2=z-.5; });
      prot.forEach(p=>{ const ox=Math.sin(tt*.35+p.ph)*4, oz=Math.cos(tt*.3+p.ph)*4; p.arr.forEach((s,i)=>{ s.x=p.base[i][0]+ox; s.z=p.base[i][2]+oz; }); if(p.name==='carrier'){ glc.x=P.carrier.c[0]+ox; glc.z=P.carrier.c[1]+oz; glc.y=38-((tt*12)%76); } });
      wat.forEach((w,i)=>{ const y=60-(((tt*22)+i*26)%120); const kx=P.kanal.c[0]+Math.sin(tt*.35+prot[1].ph)*4, kz=P.kanal.c[1]+Math.cos(tt*.3+prot[1].ph)*4; w[0].x=kx; w[0].y=y; w[0].z=kz; w[1].x=kx-3.2; w[1].y=y+2.4; w[1].z=kz; w[2].x=kx+3.2; w[2].y=y+2.4; w[2].z=kz; });
    };
    update(0);
    const names={ lipid:{t:'Phospholipid (hydrophiler Kopf)',card:'phospho'}, integral:{t:'integrales Membranprotein',card:'mproteine'}, glyko:{t:'Zuckerketten (Glykokalyx)',card:'glykokalyx'},
      kanal:{t:'Kanalprotein (Aquaporin)',card:'aquaporin'}, carrier:{t:'Carrier mit Glucose',card:'erleichtert'}, peripher:{t:'peripheres Protein',card:'mproteine'},
      chol:{t:'Cholesterin',card:'cholesterin'}, wasser:{t:'Wassermolekül',card:'osmose'} };
    return {S,L,T,names,update};
  }
  return {View, buildCell, buildMembrane};
})();

const P = {cyan:'#46F0D2', pink:'#FF5A9E', amber:'#FFB84D', lilac:'#A894FF', green:'#7BE36A', blue:'#5EC8FF', text:'#EAF6F7', text2:'#9FC1C7', deep:'#0A1C2E', red:'#FF6B6B'};
const MODULES = {};
const GLOW = id => `<filter id="${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
const svgNS='http://www.w3.org/2000/svg';
function stepper(host, steps, render, opts){
  opts=opts||{}; let i=0, timer=null;
  host.insertAdjacentHTML('beforeend',`<div class="stepper"><button class="btn ghost small sp-prev" aria-label="Schritt zurück">Zurück</button><div class="sp-dots">${steps.map((_,k)=>`<button class="sp-dot" data-k="${k}" aria-label="Schritt ${k+1}"></button>`).join('')}</div><button class="btn small sp-next">Weiter</button>${opts.auto?'<button class="btn ghost small sp-auto">Automatisch</button>':''}</div><div class="sp-text" aria-live="polite"></div>`);
  const go=(k)=>{ i=Math.max(0,Math.min(steps.length-1,k)); render(i); $('.sp-text',host).innerHTML=`<span class="sp-n">${i+1}/${steps.length}</span> ${steps[i]}`; $$('.sp-dot',host).forEach((d,j)=>d.classList.toggle('on',j<=i)); $('.sp-prev',host).disabled=i===0; $('.sp-next',host).textContent=i===steps.length-1?'Von vorn':'Weiter'; if(i===steps.length-1 && opts.onEnd) opts.onEnd(); };
  $('.sp-prev',host).addEventListener('click',()=>{ stop(); go(i-1); }); $('.sp-next',host).addEventListener('click',()=>{ stop(); go(i===steps.length-1?0:i+1); });
  $$('.sp-dot',host).forEach(d=>d.addEventListener('click',()=>{ stop(); go(+d.dataset.k); }));
  const stop=()=>{ if(timer){ clearInterval(timer); timer=null; const a=$('.sp-auto',host); if(a) a.textContent='Automatisch'; } };
  const a=$('.sp-auto',host); if(a) a.addEventListener('click',()=>{ if(timer){ stop(); return; } a.textContent='Pause'; go(0); timer=setInterval(()=>{ if(i>=steps.length-1){ stop(); return; } go(i+1); }, 3200); });
  CLEANUP.push(stop); go(0); return {go};
}

MODULES.microscope=(host)=>{
  const specs=[['zwiebel','Zwiebelhaut'],['mund','Mundschleimhaut'],['joghurt','Joghurt']], mags=[['40','40-fach'],['100','100-fach'],['400','400-fach'],['em','Elektronenmikroskop']];
  let sp='zwiebel', mg='40'; const seen=new Set();
  host.innerHTML=`<div class="mic"><div class="mic-view"><svg viewBox="0 0 400 400" class="mic-svg" role="img" aria-label="Blick durch das Mikroskop"><defs><clipPath id="micc"><circle cx="200" cy="200" r="192"/></clipPath><radialGradient id="micv"><stop offset=".75" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient></defs><g clip-path="url(#micc)" class="mic-content"></g><circle cx="200" cy="200" r="192" fill="url(#micv)"/><circle cx="200" cy="200" r="194" fill="none" stroke="#1B2B3A" stroke-width="8"/></svg><div class="mic-scale"><i></i><span></span></div></div>
    <div class="mic-ctrl"><p class="ctl-l">Präparat</p><div class="seg-row sp">${specs.map(([k,n])=>`<button class="seg-btn" data-s="${k}">${n}</button>`).join('')}</div>
    <p class="ctl-l">Vergrößerung</p><div class="seg-row mg">${mags.map(([k,n])=>`<button class="seg-btn" data-m="${k}">${n}</button>`).join('')}</div><p class="mic-note" aria-live="polite"></p></div></div>`;
  const rand=seeded(5);
  const brick=(cw,ch,col,nuc)=>{ let o=`<rect width="400" height="400" fill="#F7EEF0"/>`; for(let r=0,y=-ch/2;y<400;y+=ch,r++){ const off=(r%2)*cw*.45; for(let x=-cw+off;x<400;x+=cw){ const j=(rand()-.5)*cw*.15; o+=`<rect x="${x+j}" y="${y}" width="${cw}" height="${ch}" fill="${col}" stroke="#B2899A" stroke-width="${Math.max(.6,ch/22)}"/>`; if(nuc && rand()<.5) o+=`<ellipse cx="${x+j+cw*rand()}" cy="${y+ch/2}" rx="${ch*.18}" ry="${ch*.14}" fill="#C9B6C0" stroke="#8D6E80" stroke-width=".8"/>`; } } return o; };
  const cells=(n,sz)=>{ let o=`<rect width="400" height="400" fill="#F1F6FB"/>`; for(let i=0;i<n;i++){ const cx=rand()*400, cy=rand()*400, r=sz*(.7+rand()*.5); let p=''; for(let k=0;k<7;k++){ const a=k/7*6.283+rand()*.4, rr=r*(.75+rand()*.4); p+=(k?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+' '+(cy+Math.sin(a)*rr).toFixed(1); } o+=`<path d="${p}Z" fill="#CFE3F5" fill-opacity=".75" stroke="#6E9CC8" stroke-width="${Math.max(.6,sz/40)}"/><circle cx="${cx+r*.1}" cy="${cy}" r="${Math.max(1.2,sz*.12)}" fill="#2C4FA0"/>`; } return o; };
  const yog=(len,n)=>{ let o=`<rect width="400" height="400" fill="#FBFAF6"/>`; for(let i=0;i<14;i++) o+=`<circle cx="${rand()*400}" cy="${rand()*400}" r="${len*1.2+rand()*len*2}" fill="#F2EBD8" stroke="#D9CCAA" stroke-width=".8"/>`; for(let i=0;i<n;i++){ const x=rand()*400,y=rand()*400,a=rand()*180; for(let k=0;k<1+Math.floor(rand()*3);k++) o+=`<rect x="${x+k*len*1.15}" y="${y}" width="${len}" height="${Math.max(1,len*.3)}" rx="${len*.15}" fill="#6A6378" transform="rotate(${a} ${x} ${y})"/>`; } return o; };
  const em = {
    zwiebel:`<rect width="400" height="400" fill="#9A97A6"/><rect x="0" y="0" width="70" height="400" fill="#6F6C7A"/><rect x="66" y="0" width="6" height="400" fill="#2B2838"/><rect x="72" y="0" width="5" height="400" fill="#D9D6E5"/><rect x="77" y="0" width="5" height="400" fill="#2B2838"/>
      <ellipse cx="300" cy="140" rx="160" ry="110" fill="#B9B6C6" stroke="#2B2838" stroke-width="3"/><text x="300" y="140" text-anchor="middle" class="mic-l">Vakuole</text>
      <ellipse cx="160" cy="300" rx="50" ry="22" fill="#77748A" stroke="#2B2838" stroke-width="3"/><path d="M125 300 l10 -10 l10 18 l10 -18 l10 18 l10 -18 l10 10" stroke="#2B2838" stroke-width="2" fill="none"/><text x="160" y="345" text-anchor="middle" class="mic-l">Mitochondrium</text>
      <ellipse cx="300" cy="330" rx="56" ry="26" fill="#6E8E66" stroke="#2B2838" stroke-width="3"/>${[-30,-15,0,15,30].map(d=>`<rect x="${296+d}" y="318" width="7" height="24" fill="#2B2838" opacity=".7"/>`).join('')}<text x="300" y="380" text-anchor="middle" class="mic-l">Chloroplast (Leukoplast)</text>
      <text x="40" y="30" class="mic-l" transform="rotate(90 40 30)">Zellwand</text><text x="90" y="60" class="mic-l">Membran</text>`,
    mund:`<rect width="400" height="400" fill="#A6A3B2"/><path d="M0 60 C120 40 260 90 400 50" stroke="#2B2838" stroke-width="4" fill="none"/><text x="20" y="40" class="mic-l">Zellmembran</text>
      <circle cx="250" cy="250" r="110" fill="#8986A0" stroke="#2B2838" stroke-width="5" stroke-dasharray="20 5"/><circle cx="270" cy="230" r="28" fill="#4E4A64"/><text x="250" y="380" text-anchor="middle" class="mic-l">Zellkern mit Kernporen</text>
      <ellipse cx="90" cy="200" rx="48" ry="20" fill="#77748A" stroke="#2B2838" stroke-width="3"/><path d="M58 200 l10 -10 l10 18 l10 -18 l10 18 l10 -18" stroke="#2B2838" stroke-width="2" fill="none"/><text x="90" y="240" text-anchor="middle" class="mic-l">Mitochondrium</text>
      ${[0,1,2].map(i=>`<path d="M${60+i*14} 290 q40 -30 80 0" stroke="#2B2838" stroke-width="3" fill="none"/>`).join('')}<text x="110" y="325" text-anchor="middle" class="mic-l">raues ER</text>`,
    joghurt:`<rect width="400" height="400" fill="#A6A3B2"/><rect x="40" y="110" width="320" height="180" rx="90" fill="#8E8B9C" stroke="#2B2838" stroke-width="10"/><rect x="52" y="122" width="296" height="156" rx="78" fill="#B6B3C2" stroke="#2B2838" stroke-width="3"/>
      <path d="M140 200 c20 -40 60 20 90 -10 s50 30 70 0 s-40 50 -80 30 s-60 -30 -80 -20z" fill="none" stroke="#2B2838" stroke-width="3"/>${[[100,170],[120,240],[300,250],[320,160],[200,150],[250,260],[180,240]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="#2B2838"/>`).join('')}
      <text x="200" y="90" text-anchor="middle" class="mic-l">Ein Bakterium: kein Zellkern!</text><text x="200" y="330" text-anchor="middle" class="mic-l">DNA frei im Cytoplasma, Ribosomen, Zellwand</text>`
  };
  const notes = {
    'zwiebel40':'Ein Netz aus länglichen Zellen – wie Mauersteine. Die roten Vakuolen färben die Zellen.','zwiebel100':'Die Zellwände sind deutlich zu sehen, in manchen Zellen ein Zellkern.','zwiebel400':'Jetzt erkennst du Zellwand, rote Vakuole und den Zellkern. Mitochondrien oder Ribosomen? Unsichtbar – zu klein.','zwiebelem':'Erst das Elektronenmikroskop zeigt Membranen, Mitochondrien und Plastiden. Das Bild ist ein Schwarz-Weiß-Schnitt – keine Farben!',
    'mund40':'Kleine, unregelmäßige Plättchen – Mundschleimhautzellen (mit Methylenblau gefärbt).','mund100':'Flache Zellen ohne Zellwand, jede mit einem dunklen Zellkern.','mund400':'Typische Tierzellen: unregelmäßige Form, Zellmembran statt Zellwand, keine große Vakuole.','mundem':'Im EM: Zellkern mit Kernporen, Mitochondrien, raues ER – Kompartimentierung!',
    'joghurt40':'Bei 40-facher Vergrößerung: nichts als Fetttröpfchen. Bakterien sind hier noch unsichtbar.','joghurt100':'Immer noch kaum etwas zu sehen – die Bakterien sind nur 2–5 µm lang.','joghurt400':'Winzige Stäbchen, teils in Ketten: Milchsäurebakterien. Innere Details? Keine Chance – unterhalb der Auflösungsgrenze.','joghurtem':'Erst im EM sieht man das Innere: kein Zellkern, DNA frei im Cytoplasma, Ribosomen, Zellwand – ein Prokaryot.'
  };
  const scales={'40':'500 µm','100':'200 µm','400':'50 µm','em':'1 µm'};
  const draw=()=>{ let o='';
    if(mg==='em') o=em[sp];
    else if(sp==='zwiebel') o=mg==='40'?brick(30,7,'#E8A2B6',false):mg==='100'?brick(76,17,'#E595AD',true):`<rect width="400" height="400" fill="#F4E9EC"/>${[0,1,2].map(r=>{ const y=40+r*115, off=r%2*-120; return [0,1,2].map(c=>{ const x=off+c*250; return `<rect x="${x}" y="${y}" width="250" height="110" fill="#F6E2E8" stroke="#8D6E80" stroke-width="5"/><rect x="${x+8}" y="${y+8}" width="234" height="94" rx="10" fill="#D9567E" opacity=".75"/><ellipse cx="${x+60+((r*3+c)%3)*50}" cy="${y+36}" rx="18" ry="13" fill="#E9D7E0" stroke="#7B5D70" stroke-width="2"/><circle cx="${x+64+((r*3+c)%3)*50}" cy="${y+34}" r="4" fill="#7B5D70"/>`; }).join(''); }).join('')}`;
    else if(sp==='mund') o=mg==='40'?cells(120,7):mg==='100'?cells(30,20):cells(4,95);
    else o=mg==='40'?yog(.6,60):mg==='100'?yog(1.4,90):yog(4,140);
    $('.mic-content',host).innerHTML=o; $('.mic-scale span',host).textContent=scales[mg]; $('.mic-note',host).textContent=notes[sp+mg];
    $$('.sp .seg-btn',host).forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===sp)); $$('.mg .seg-btn',host).forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mg));
    seen.add(sp+mg); if(seen.size>=8) markDone('mic8',15);
  };
  $$('.sp .seg-btn',host).forEach(b=>b.addEventListener('click',()=>{ sp=b.dataset.s; draw(); }));
  $$('.mg .seg-btn',host).forEach(b=>b.addEventListener('click',()=>{ mg=b.dataset.m; draw(); }));
  draw();
};

  const hunts=[

  const load=(t)=>{ type=t; const m=M3.buildCell(t); view.S=m.S; view.L=m.L; view.T=[]; view.names=m.names; view.update=m.update; view.hl=null; info(null); };
  const info=(g)=>{ const box=$('.m3-info',host); if(!g){ box.innerHTML='<p class="muted">Tippe ein Organell im Modell an.</p>'; return; } const n=view.names[g]; const c=CARDS[n.card];
    box.innerHTML=`<p class="fc-k">Steckbrief</p><h4>${esc(n.t)}</h4><div class="fc-a">${c?c.a:''}</div><button class="btn ghost small hlb">${view.hl===g?'Alle zeigen':'Nur dieses zeigen'}</button>`;
    $('.hlb',box).addEventListener('click',()=>{ view.hl = view.hl===g?null:g; info(g); }); };
  view.onPick=(g)=>{ if(huntIdx>=0){ const h=hunts[huntIdx]; if(g===h.g){ toast('Gefunden: '+view.names[g].t); huntIdx++; nextHunt(); } else { $('.hunt-msg',host).textContent=`Das ist: ${view.names[g].t}. Versuch es nochmal.`; } } info(g); };
  const nextHunt=()=>{ const box=$('.hunt',host); if(huntIdx>=hunts.length){ box.innerHTML='<p class="hunt-ok">Alle Suchaufträge gelöst!</p>'; markDone('cell3d-hunt',30); huntIdx=-1; return; }
    const h=hunts[huntIdx]; if(h.type==='plant' && type!=='plant'){ box.innerHTML=`<p class="hunt-q"><span class="sp-n">${huntIdx+1}/${hunts.length}</span> Wechsle jetzt zur Pflanzenzelle!</p><p class="hunt-msg"></p>`; return; }
    box.innerHTML=`<p class="hunt-q"><span class="sp-n">${huntIdx+1}/${hunts.length}</span> ${h.q}</p><p class="hunt-msg"></p>`; };
  $$('.ct',host).forEach(b=>b.addEventListener('click',()=>{ $$('.ct',host).forEach(x=>x.setAttribute('aria-pressed',x===b)); load(b.dataset.t); if(huntIdx>=0) nextHunt(); }));
  $('.cutb',host).addEventListener('click',function(){ view.cut=!view.cut; this.setAttribute('aria-pressed',view.cut); });

  $('.huntb',host).addEventListener('click',()=>{ huntIdx=0; if(!view.cut){ view.cut=true; $('.cutb',host).setAttribute('aria-pressed','true'); } nextHunt(); });
  load('animal');
};

/* ---------- Kapitel 3: Proteine ---------- */
MODULES.protein=(host)=>{
  const cols=['#FF5A9E','#A894FF','#7BE36A','#FFB84D','#5EC8FF','#FF8A6B'];
  let beads='', lines=''; for(let i=0;i<16;i++){ const x=110+i*45, y=200+Math.sin(i*.9)*26; if(i){ const px=110+(i-1)*45, py=200+Math.sin((i-1)*.9)*26; lines+=`<line x1="${px}" y1="${py}" x2="${x}" y2="${y}" stroke="#EAF6F7" stroke-width="3"/>`; } beads+=`<circle cx="${x}" cy="${y}" r="15" fill="${cols[i%6]}"/><text x="${x}" y="${y+4}" text-anchor="middle" class="aa-t">${['Gly','Ala','Cys','Ser','Val','Leu'][i%6]}</text>`; }
  let helix='M200 80'; for(let i=0;i<8;i++) helix+=' c 40 0 40 24 0 24';
  const sheet=[0,1,2].map(i=>`<path d="M430 ${130+i*44} h240" stroke="#7BE36A" stroke-width="10" stroke-linecap="round" ${i%2?`transform="rotate(180 550 ${130+i*44})"`:''}/>`).join('')+[0,1].map(i=>[470,520,570,620].map(x=>`<line x1="${x}" y1="${138+i*44}" x2="${x}" y2="${166+i*44}" stroke="#FFB84D" stroke-width="2.5" stroke-dasharray="3 3"/>`).join('')).join('');
  const tert=`<path d="M290 130 c90 -100 230 -30 160 60 c-55 75 100 130 130 40 c30 -100 -160 -130 -185 10 c-15 85 130 150 195 75" fill="none" stroke="#A894FF" stroke-width="15" stroke-linecap="round"/><path d="M402 236 L522 160" stroke="#FFB84D" stroke-width="6" stroke-dasharray="8 6"/><text x="560" y="150" class="sc-l" fill="#FFB84D">Disulfidbrücke</text>`;
  const quart=`<g class="spin-slow" style="transform-origin:450px 200px">${[[-60,-55,'#FF8DB4'],[60,-55,'#B7A3FF'],[-60,55,'#B7A3FF'],[60,55,'#FF8DB4']].map(([dx,dy,c])=>`<path d="M${450+dx-52} ${200+dy} c0 -44 44 -60 70 -44 c32 22 34 64 0 82 c-32 15 -70 2 -70 -38z" fill="${c}" stroke="#0A1C2E" stroke-width="3"/>`).join('')}</g>`;
  let unf='M90 180'; const r=seeded(3); for(let i=0;i<22;i++) unf+=` q ${(10+r()*12).toFixed(0)} ${(-40+r()*80).toFixed(0)} ${(24+r()*10).toFixed(0)} ${(-14+r()*28).toFixed(0)}`;
  host.innerHTML=`<svg viewBox="0 0 900 380" class="scene-svg protein lvl-1" role="img" aria-label="Proteinfaltung">
    <g class="pl pl-1">${lines}${beads}<text x="450" y="330" text-anchor="middle" class="stage-cap">Primärstruktur: die Reihenfolge der Aminosäuren, verknüpft über Peptidbindungen</text></g>
    <g class="pl pl-2"><path d="${helix}" fill="none" stroke="#A894FF" stroke-width="9"/>${sheet}<text x="450" y="345" text-anchor="middle" class="stage-cap">Sekundärstruktur: α-Helix und β-Faltblatt – gehalten von Wasserstoffbrücken (gelb)</text></g>
    <g class="pl pl-3">${tert}<text x="450" y="365" text-anchor="middle" class="stage-cap">Tertiärstruktur: räumliche Faltung – erst jetzt ist das Protein aktiv</text></g>
    <g class="pl pl-4">${quart}<text x="450" y="365" text-anchor="middle" class="stage-cap">Quartärstruktur: mehrere Ketten (z. B. Hämoglobin aus vier Ketten)</text></g>
    <g class="pl pl-d"><path d="${unf}" fill="none" stroke="#B7A3FF" stroke-width="6" stroke-linecap="round"/><path d="${unf}" fill="none" stroke="#FF8DB4" stroke-width="6" stroke-linecap="round" transform="translate(0 70)" opacity=".8"/><text x="450" y="50" text-anchor="middle" class="stage-cap">Denaturiert: entfaltet, verklumpt, inaktiv – die Primärstruktur bleibt</text></g>
    <g class="heat">${[0,1,2,3,4].map(i=>`<path d="M${200+i*120} 375 q-12 -20 0 -40 t0 -40" fill="none" stroke="#FF8A3D" stroke-width="4" stroke-linecap="round" class="heatwave" style="animation-delay:${i*.2}s"/>`).join('')}</g>
  </svg>
  <div class="ctrl-row"><label class="slider-l">Strukturebene <input type="range" min="1" max="4" step="1" value="1" class="lvl-range"></label><span class="lvl-name">1 · Primärstruktur</span><button class="seg-btn heat-btn" aria-pressed="false">Hitze!</button></div>`;
  const svg=$('.protein',host), rg=$('.lvl-range',host), names=['','Primärstruktur','Sekundärstruktur','Tertiärstruktur','Quartärstruktur'], hb=$('.heat-btn',host);
  const set=()=>{ svg.setAttribute('class','scene-svg protein lvl-'+rg.value); $('.lvl-name',host).textContent=rg.value+' · '+names[rg.value]; rg.setAttribute('aria-valuetext',names[rg.value]); hb.setAttribute('aria-pressed','false'); hb.textContent='Hitze!'; if(rg.value==='4') markDone('prot4',10); };
  rg.addEventListener('input',set);
  hb.addEventListener('click',()=>{ const on=hb.getAttribute('aria-pressed')!=='true'; hb.setAttribute('aria-pressed',String(on));
    if(on){ svg.setAttribute('class','scene-svg protein lvl-'+rg.value+' heating'); setTimeout(()=>{ if(hb.getAttribute('aria-pressed')==='true'){ svg.setAttribute('class','scene-svg protein lvl-d heating'); $('.lvl-name',host).textContent='Denaturiert'; markDone('denat',10); } },RM?0:900); hb.textContent='Abkühlen'; }
    else { svg.setAttribute('class','scene-svg protein lvl-d'); hb.textContent='Hitze!'; toast('Abgekühlt – die Struktur kommt nicht zurück. Denaturierung ist meist irreversibel.'); } });
};

/* ---------- Kapitel 3: Dauerwelle ---------- */
MODULES.perm=(host)=>{
  const chain=(x,curl)=>{ let p=`M${x} 40`; for(let i=0;i<8;i++){ p+= curl ? ` q ${i%2?40:-40} 18 0 36` : ` q ${i%2?8:-8} 18 0 36`; } return p; };
  const bridges=(ys,curl,cls)=>ys.map(y=>{ const dx=curl?((Math.floor((y-40)/36)%2)?16:-16):0; return `<g class="${cls}"><line x1="${200+dx}" y1="${y}" x2="${300+dx}" y2="${y}" stroke="#FFB84D" stroke-width="5"/><circle cx="${200+dx}" cy="${y}" r="5" fill="#FFB84D"/><circle cx="${300+dx}" cy="${y}" r="5" fill="#FFB84D"/><text x="${250+dx}" y="${y-8}" text-anchor="middle" class="ss-t">S–S</text></g>`; }).join('');
  host.innerHTML=`<svg viewBox="0 0 900 360" class="scene-svg perm" role="img" aria-label="Dauerwelle auf Molekülebene">
    <g class="pw pw0"><path d="${chain(200,false)}" class="kchain"/><path d="${chain(300,false)}" class="kchain"/>${bridges([76,148,220,292],false,'ss')}<text x="600" y="120" class="sc-l">Keratinketten im glatten Haar</text><text x="600" y="145" class="sc-l">Disulfidbrücken halten die Form</text></g>
    <g class="pw pw1"><path d="${chain(200,true)}" class="kchain"/><path d="${chain(300,true)}" class="kchain"/>${bridges([76,148,220,292],false,'ss broken')}<text x="600" y="120" class="sc-l">Wellmittel löst die Brücken</text><text x="600" y="145" class="sc-l">Haare auf Wickler: Ketten verschieben sich</text></g>
    <g class="pw pw2"><path d="${chain(200,true)}" class="kchain"/><path d="${chain(300,true)}" class="kchain"/>${bridges([58,130,202,274],true,'ss new')}<text x="600" y="120" class="sc-l">Fixierung knüpft neue Brücken</text><text x="600" y="145" class="sc-l">an anderen Stellen: Locken bleiben</text></g>
    <g transform="translate(720 230)"><circle r="56" fill="none" stroke="#C99A6B" stroke-width="4" class="pw-hair"/></g>
  </svg>`;
  const svg=$('.perm',host);
  stepper(host,['Glattes Haar: Die Keratinketten sind über viele <strong>Disulfidbrücken</strong> (S–S) fest verbunden – sie bestimmen die Form (Tertiärstruktur).','Das Wellmittel <strong>löst die Disulfidbrücken</strong>. Auf dem Wickler werden die Ketten in Lockenform gebogen und gegeneinander verschoben.','Das Fixiermittel <strong>knüpft neue Disulfidbrücken</strong> – an neuen Positionen. Die Ketten sind in der Lockenform „festgeheftet“: Die Locken halten.'],
    (i)=>{ $$('.pw',svg).forEach((g,k)=>g.classList.toggle('on',k===i)); svg.dataset.s=i; },{onEnd:()=>markDone('perm',10)});
};

/* ---------- Kapitel 3: Zucker-Baukasten ---------- */
MODULES.sugar=(host)=>{
  host.innerHTML=`<svg viewBox="0 0 900 340" class="scene-svg sugar" role="img" aria-label="Zucker-Baukasten"><g class="chain"></g><g class="waters"></g><text x="450" y="310" text-anchor="middle" class="stage-cap sugar-cap">Füge Bausteine hinzu.</text></svg>
    <div class="ctrl-row"><button class="seg-btn add" data-s="Glc">+ Glucose</button><button class="seg-btn add" data-s="Fru">+ Fructose</button><button class="seg-btn link" data-l="staerke" aria-pressed="true">wie Stärke</button><button class="seg-btn link" data-l="cellulose" aria-pressed="false">wie Cellulose</button><button class="seg-btn rst">Neu</button></div>`;
  let chain=[], mode='staerke'; const svg=$('.sugar',host);
  const draw=(added)=>{ const n=chain.length; let o='';
    const pos=i=> mode==='staerke'?[110+i*55,150+Math.sin(i*.8)*48]:[110+i*55,150];
    for(let i=1;i<n;i++){ const [x1,y1]=pos(i-1),[x2,y2]=pos(i); o+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#EAF6F7" stroke-width="3"/><text x="${(x1+x2)/2}" y="${(y1+y2)/2-8}" text-anchor="middle" class="o-t">O</text>`; }
    chain.forEach((s,i)=>{ const [x,y]=pos(i); o+=`<g class="${i===n-1&&added?'pop':''}" style="transform-origin:${x}px ${y}px">${s==='Glc'?hexa(x,y,22,'#FFD97A','#B9921F','Glc'):penta(x,y,22,'#FFB07A','#C46A2A','Fru')}</g>`; });
    if(mode==='cellulose'&&n>=3){ o+=chain.map((s,i)=>{ const [x]=pos(i); return `<g opacity=".45">${hexa(x,212,18,'#FFD97A','#B9921F')}</g><line x1="${x}" y1="176" x2="${x}" y2="192" stroke="#5EC8FF" stroke-width="2" stroke-dasharray="3 3"/>`; }).join('')+`<text x="${pos(n-1)[0]+40}" y="216" class="o-t">Nachbarkette (Wasserstoffbrücken)</text>`; }
    $('.chain',svg).innerHTML=o; const glc=chain.filter(s=>s==='Glc').length, fru=n-glc;
    $('.sugar-cap',svg).textContent = n===0?'Füge Bausteine hinzu.':n===1?`Monosaccharid (${chain[0]==='Glc'?'Glucose':'Fructose'}) – ein Einfachzucker`:n===2?(glc===1&&fru===1?'Disaccharid: Saccharose (Haushaltszucker) = Glucose + Fructose':'Disaccharid aus zwei Einfachzuckern'):(fru===0?(mode==='staerke'?'Polysaccharid: gewundene Kette wie Stärke – Energiespeicher der Kartoffel':'Polysaccharid: gerade Ketten wie Cellulose – reißfeste Fasern (Papier, Baumwolle)'):'Polysaccharid aus verschiedenen Einfachzuckern');

function setupCanvas(cv,W,H){ const dpr=Math.min(2,window.devicePixelRatio||1); cv.width=W*dpr; cv.height=H*dpr; const c=cv.getContext('2d'); c.scale(dpr,dpr); return c; }
function hexPath(c,x,y,r){ c.beginPath(); for(let i=0;i<6;i++){ const a=Math.PI/3*i+Math.PI/6; const px=x+r*Math.cos(a), py=y+r*Math.sin(a); i?c.lineTo(px,py):c.moveTo(px,py); } c.closePath(); }
MODULES.diffusion=(box)=>{

  const W=800,H=420,c=setupCanvas($('.lab-cv',box),W,H); let Pp=[],raf,temp=1,fr=0;
  const reset=()=>{ Pp=[...Array(280)].map(()=>({x:rnd(14,110),y:rnd(14,330)})); fr=0; }; reset();
  const tick=()=>{ const s=7*temp; for(let k=0;k<6;k++) Pp.forEach(p=>{ p.x+=(Math.random()*2-1)*s; p.y+=(Math.random()*2-1)*s; if(p.x<6)p.x=12-p.x; if(p.x>W-6)p.x=2*(W-6)-p.x; if(p.y<6)p.y=12-p.y; if(p.y>334)p.y=668-p.y; });
    c.clearRect(0,0,W,H); const g=c.createLinearGradient(0,0,0,340); g.addColorStop(0,'rgba(94,200,255,.10)'); g.addColorStop(1,'rgba(94,200,255,.22)'); c.fillStyle=g; c.fillRect(0,0,W,340);
    c.fillStyle='#C04BE0'; Pp.forEach(p=>{ c.beginPath(); c.arc(p.x,p.y,3.2,0,7); c.fill(); });
    const bins=new Array(8).fill(0); Pp.forEach(p=>bins[Math.min(7,Math.floor(p.x/(W/8)))]++); bins.forEach((b,i)=>{ const h=Math.min(52,b/(Pp.length/8)*13); c.fillStyle='rgba(192,75,224,.85)'; c.fillRect(i*W/8+10,414-h,W/8-20,h); });
    c.fillStyle='#9FC1C7'; c.font='13px Atkinson Hyperlegible, sans-serif'; c.fillText('Konzentration in Abschnitten',10,354);
    const spread=(Math.max(...bins)-Math.min(...bins))/(Pp.length/8);

    raf=requestAnimationFrame(tick); };
  raf=requestAnimationFrame(tick); CLEANUP.push(()=>cancelAnimationFrame(raf));
  $('.temp',box).addEventListener('input',e=>{ temp=+e.target.value; }); $('.rst',box).addEventListener('click',reset);
};
MODULES.osmosis=(box)=>{

  const W=800,H=430,MX=400,BOT=410,c=setupCanvas($('.lab-cv',box),W,H); let Wp=[],Sp=[],perm=false,raf,flow=[],fr=0;

    c.setLineDash([10,7]); c.strokeStyle=perm?'#FFB84D':'#FF5A9E'; c.lineWidth=4; c.beginPath(); c.moveTo(MX,10); c.lineTo(MX,BOT); c.stroke(); c.setLineDash([]);

    raf=requestAnimationFrame(tick); };
  raf=requestAnimationFrame(tick); CLEANUP.push(()=>cancelAnimationFrame(raf));
  $('.addL',box).addEventListener('click',()=>addS(0)); $('.addR',box).addEventListener('click',()=>addS(1));

  intro:'Salzkrebschen sind ein beliebtes Fischfutter für Nutz- und Zierfische. Sie werden in Salzwasser gezüchtet. In der Natur kommen sie in großen Mengen in Salzseen vor. Das salzige Wasser spielt für das Salzkrebschen eine große Rolle.',
  info:['Der Klausurbogen muss <strong>durchnummeriert</strong> und <strong>die Hälfte der Seite als Rand</strong> frei gelassen werden.','Alle Aufgaben – natürlich mit Ausnahme der Skizzen – sind in <strong>ganzen Sätzen bzw. einem Fließtext</strong> zu beantworten. Notizen können ggf. auf einem Schmierzettel gemacht werden, der am Ende mit abgegeben wird.','Es darf <strong>nicht</strong> mit Bleistift oder in Rot geschrieben werden.','Lies die Aufgabenstellung genau durch, bevor du sie bearbeitest.'],
  materials:[
    {id:'M1', title:'Artemia salina – das „Salzkrebschen“', html:'<p>Salzkrebschen sind ein beliebtes Fischfutter für Nutz- und Zierfische. Sie werden in Salzwasser gezüchtet. In der Natur kommen sie in großen Mengen in Salzseen vor. In diesen kann sich der Salzgehalt in kurzer Zeit stark ändern, zum Beispiel wenn es regnet oder die Seen stark austrocknen. Salzkrebschen können sowohl in konzentriertem Salzwasser als auch bei sehr geringen Salzkonzentrationen überleben.</p><p>Die Salzkrebschen gehören zu den Kiemenfüßern, ihre Kiemen befinden sich an ihren Brustbeinen. Ihre Körperoberfläche ist zum größten Teil für Wasser undurchlässig. Das Gewebe der stark durchbluteten Kiemen ist dagegen gut wasserdurchlässig.</p><p>Salzkrebschen trinken kontinuierlich Wasser – pro Stunde etwa drei Prozent der eigenen Körpermasse. Es gelangt in ihren Darm. Die mit dem Wasser aufgenommenen Natrium- und Chlorid-Ionen gelangen über die Darmzellen in das Blut. Überschüssige Ionen werden über die Kiemen ausgeschieden. Benötigen Salzkrebschen Natrium- und Chlorid-Ionen, können die Ionen aus der Umgebung über die Kiemen aufgenommen werden.</p>'},

     hilfen:['Unterscheide zwei Fälle: Die Zelle liegt in einer Lösung mit weniger Salz bzw. mit mehr Salz als im Zellinneren. Wohin strömt jeweils das Wasser?','Fachbegriffe: hypotonisch, hypertonisch, selektiv permeable Membran, Wassereinstrom/-ausstrom, Platzen/Schrumpfen. Dann M1: Was passiert im Salzsee bei Regen, was bei Trockenheit?','Satzanfänge: „Befindet sich eine tierische Zelle in einer hypotonischen Lösung, …“ – „Da die Membran selektiv permeabel ist, …“ – „Für das Salzkrebschen bedeutet das, …“'],
     model:'Befindet sich eine tierische Zelle in einer hypotonischen Lösung, zum Beispiel in destilliertem Wasser, ist die Konzentration gelöster Teilchen innen höher als außen. Da die Zellmembran selektiv permeabel ist – durchlässig für Wasser, kaum für die gelösten Ionen –, strömt mehr Wasser in die Zelle ein als aus. Die Zelle schwillt an und kann platzen. In einer hypertonischen Lösung mit hoher Salzkonzentration strömt dagegen Wasser aus der Zelle aus, sie verliert Wasser und schrumpft. Im Salzsee des Salzkrebschens wechselt der Salzgehalt häufig: Nach Regen sinkt er, bei Trockenheit und Verdunstung steigt er stark an. Für das Salzkrebschen bedeutet das eine ständige Gefahr – entweder osmotischer Wasserverlust oder Wassereinstrom bis zum Platzen der Zellen. Um zu überleben, muss es seinen Wasser- und Salzhaushalt aktiv regulieren (Osmoregulation).'},
    {nr:'1 b', op:'Auswerten', ops:['Zusammenfassen','Auswerten'], afb:'II', p:8,

     hilfen:['Beschreibe zuerst, was dargestellt ist (Achsen, zwei Kurven), dann den Verlauf mit Zahlen. Erst danach deutest du mit M1.','Vergleiche drei Konzentrationen: Umgebungswasser – Darmflüssigkeit – Blut. Was passiert mit dem getrunkenen Salzwasser im Darm? Wie gelangen die Ionen ins Blut, wie werden sie wieder los?','Satzanfänge: „Das Diagramm zeigt …“ – „Mit steigender NaCl-Konzentration des Umgebungswassers …“ – „Bei 30 % beträgt …“ – „Dass das Blut weniger Salz enthält als die Darmflüssigkeit, lässt sich damit erklären, dass …“'],
     model:'Das Diagramm zeigt die NaCl-Konzentration von Darmflüssigkeit und Blut in Abhängigkeit von der NaCl-Konzentration des Umgebungswassers. Mit steigender Konzentration des Umgebungswassers steigen beide Werte linear an. Bei 0 % liegt die Darmflüssigkeit bei etwa 2,2 % und das Blut bei 0,9 %, bei 30 % liegt die Darmflüssigkeit bei etwa 4 % und das Blut bei etwa 2,7 %. Die Darmflüssigkeit ist also stets salzreicher als das Blut, und beide Körperflüssigkeiten bleiben weit unter der Konzentration des Umgebungswassers. Auswertung mit M1: Das getrunkene Salzwasser ist hyperton und wird im Darm zunächst verdünnt, weil Wassermoleküle in die Darmflüssigkeit diffundieren. Natrium- und Chlorid-Ionen werden ins Blut aufgenommen; da ihre Konzentration dort geringer ist als in der Darmflüssigkeit, erfolgt dieser Transport passiv mit dem Konzentrationsgefälle. Dass das Blut trotzdem deutlich weniger Salz enthält, liegt daran, dass überschüssige Ionen über die gut durchbluteten Kiemen aktiv unter Energieverbrauch ausgeschieden werden.'},
    {nr:'1 c', op:'Erklären', ops:['Erklären','Hypothese aufstellen'], afb:'II–III', p:6,

      {t:'Kontinuierliches Trinken gleicht den Wasserverlust aus', p:1, some:['ausgleich','ausgeglichen','gleicht den','gleichen den','gleicht diesen','gleichen diesen','gleicht das','ersetz','kompensier'], min:1},
      {t:'Mit dem Wasser wird viel Salz aufgenommen, das unter Energieaufwand ausgeschieden werden muss', p:1, all:[['salz','nacl','ionen'],['energie','atp','aktiv']]},
      {t:'Hypothese ausdrücklich formuliert', p:1, some:['hypothese','ich vermute','vermutlich','vermutung'], min:1},
      {t:'Trockenphasen erhöhen die Salzkonzentration → stärkerer Wasserverlust, mehr Salzaufnahme', p:1, all:[['trocken','austrockn','verdunst'],['steigt','steigende','hoeher','zunehm','erhoeh']]},
      {t:'Folge: Grenze der Regulation – ab einer bestimmten Konzentration kein Überleben', p:1, some:['nicht mehr ueberleben','nicht ueberleben','sterben','tod','grenze','nicht mehr ausgleichen','nicht mehr ausreichend'], min:1}],
     hilfen:['Warum trinkt ein Tier, das im Wasser lebt? Überlege, wo es Wasser verliert – und warum (M1: Kiemen sind wasserdurchlässig).','Kette: hypertonische Umgebung → Wasser strömt an den Kiemen aus → Trinken gleicht aus → dabei viel NaCl aufgenommen → aktive Ausscheidung kostet Energie. Für die Hypothese: Was ändert eine Trockenphase am Salzgehalt?','Satzanfänge: „Da das Umgebungswasser hyperton ist, …“ – „Um diesen Verlust auszugleichen, …“ – „Ich stelle die Hypothese auf, dass …, weil …“'],
     model:'Salzkrebschen leben meist in stark salzhaltigem, also hypertonischem Wasser. Über die gut wasserdurchlässigen Kiemen verlieren sie deshalb ständig Wasser, weil Wassermoleküle osmotisch in das Umgebungswasser diffundieren, wo die Salzkonzentration höher ist. Durch das kontinuierliche Trinken gleichen sie diesen Wasserverlust aus; deshalb nehmen sie trotz der großen Trinkmenge nicht an Masse zu. Mit dem Wasser nehmen sie allerdings auch viel Natriumchlorid auf, dessen Ionen an den Kiemen aktiv unter Verbrauch von Energie (ATP) ausgeschieden werden müssen. Hypothese: Ich vermute, dass ab einer bestimmten Salzkonzentration die Salzkrebschen nicht mehr überleben können. Bei stärkeren Trockenphasen verdunstet Wasser, die Salzkonzentration im See steigt. Dadurch nimmt der osmotische Wasserverlust zu, die Tiere müssten noch mehr trinken und noch mehr Salz unter Energieaufwand ausscheiden. Irgendwann können sie den Verlust nicht mehr ausgleichen – die Grenze ihrer Regulation ist erreicht.'},

     hilfen:['Beschreibe zuerst, woraus das Modell aufgebaut ist (von außen nach innen). Dann: Wozu braucht man so ein Modell überhaupt?','Fachbegriffe: Sandwich-Modell, Proteinschicht, Lipid-Doppelschicht, hydrophiler Kopf, hydrophobe Fettsäureschwänze; Modell = vereinfachte, anschauliche Darstellung.','Satzanfänge: „Das Modell zeigt …“ – „Modelle sind in der Biologie wichtig, weil …“'],
     model:'Das Modell in M3 zeigt das Sandwich-Modell nach Davson und Danielli. In der Mitte liegt eine Lipid-Doppelschicht aus Phospholipiden: Die hydrophilen Köpfe zeigen nach außen zum Wasser, die hydrophoben Fettsäureschwänze liegen innen zusammen. Beidseitig ist diese Doppelschicht von einer geschlossenen Proteinschicht bedeckt. Modelle sind für die Biologie wichtig, weil sie Strukturen vereinfacht und anschaulich darstellen, die man nicht direkt sehen kann. Sie geben einen Überblick, machen Vorgänge vorstellbar und lassen sich mit Befunden überprüfen.'},

let pkTimer=null;
function probeCards(){ return `<section class="pk-list"><h2 class="h2">Probeklausuren im Klausurformat</h2><p class="muted">Eine ganze Klausur mit Material, Operatoren und Erwartungshorizont – so wie im Unterricht.</p><div class="pk-grid">${PROBEKLAUSUREN.map(k=>{ const tot=k.tasks.reduce((a,t)=>a+t.p,0), best=k.tasks.reduce((a,t,i)=>a+(S.best[`pk-${k.id}-${i}`]||0),0);
  return `<a class="panel pk-card" href="#/pk/${k.id}"><b>${esc(k.title)}</b><span>${k.tasks.length} Aufgaben · ${tot} Punkte · ${k.minutes} Minuten</span><span class="pk-st">${k.stations.map(id=>{ const c=chById(id); return `<i style="--c:${c.color}">${c.nr}</i>`; }).join('')} Stationen</span>${best?`<span class="pc">Bisher bester Check: ${best} von ${tot} Punkten</span>`:''}</a>`; }).join('')}</div></section>`; }

function renderPK(k){
  clearInterval(pkTimer); const tot=k.tasks.reduce((a,t)=>a+t.p,0);
  $('#main').innerHTML=`<section class="plain wide pk"><a class="back" href="#/probe">Klausur-Simulator</a><p class="ch-depth"><span class="sbar"></span>Probeklausur · ${k.tasks.length} Aufgaben · ${tot} Punkte</p><h1 class="sec-t">${esc(k.title)}</h1><p class="lead">${esc(k.intro)}</p>
    <div class="pk-setup"><div class="panel"><h3>Informationen</h3><ul class="pk-info">${k.info.map(i=>`<li>${i}</li>`).join('')}</ul></div>
      <fieldset class="panel probe-opts"><legend>Wie willst du schreiben?</legend>
        <label><input type="radio" name="pkm" value="ueben" checked> <span><b>Übungsmodus</b> – gestufte Hilfen und Check nach jeder Aufgabe</span></label>
        <label><input type="radio" name="pkm" value="ernst"> <span><b>Ernstfall</b> – ohne Hilfen, Auswertung erst bei Abgabe</span></label>
        <label><input type="checkbox" id="pktm"> <span>Mit Countdown (${k.minutes} Minuten)</span></label>
        <button class="btn" id="pkgo">Klausur beginnen</button></fieldset></div>
    <p class="small muted">Passt zu den Stationen: ${k.stations.map(id=>{ const c=chById(id); return `<a href="#/k/${c.id}/entdecken">${esc(c.title)}</a>`; }).join(', ')}.</p></section>`;
  $('#pkgo').addEventListener('click',()=>startPK(k,$('input[name=pkm]:checked').value==='ernst',$('#pktm').checked));
}
function startPK(k,ernst,timer){
  const tot=k.tasks.reduce((a,t)=>a+t.p,0), t0=Date.now();
  $('#main').innerHTML=`<section class="pk-exam ${ernst?'ernst':''}"><div class="pk-bar"><div><p class="ch-depth"><span class="sbar"></span>${ernst?'Ernstfall':'Übungsmodus'} · ${tot} Punkte</p><h1>${esc(k.title)}</h1></div>${timer?`<span class="clock" id="clock">${k.minutes}:00</span>`:''}</div>
    <div class="pk-cols"><aside class="pk-mat"><div class="pk-tabs" role="tablist">${k.materials.map((m,i)=>`<button class="seg-btn pkt" data-i="${i}" aria-pressed="${i===0}">${m.id}</button>`).join('')}</div>
      ${k.materials.map((m,i)=>`<article class="panel pk-m" data-i="${i}" ${i?'hidden':''}><h3>${m.id}: ${esc(m.title)}</h3>${m.html}${m.fig?`<figure class="slide">${fig(m.fig)}</figure>`:''}</article>`).join('')}</aside>
      <div class="pk-tasks">${k.tasks.map((t,i)=>`<p class="pk-nr">Aufgabe ${t.nr}</p>`+taskCard(null,t,i,`pk-${k.id}-${i}`,ernst?'probe':'')).join('')}
      <div class="pane-end"><button class="btn" id="pkfin">${ernst?'Klausur abgeben':'Gesamtauswertung'}</button></div><div id="pkres"></div></div></div></section>`;
  $$('.pkt').forEach(b=>b.addEventListener('click',()=>{ $$('.pkt').forEach(x=>x.setAttribute('aria-pressed',x===b)); $$('.pk-m').forEach(a=>a.hidden=a.dataset.i!==b.dataset.i); }));
  $$('.task-head .op-wrap').forEach((w,i)=>{ const t=k.tasks[i]; if(t.ops&&t.ops.length>1) w.querySelector('.op-help').insertAdjacentHTML('beforebegin',t.ops.slice(1).map(o=>`<span class="op-x" title="${esc(OPERATORS[o]||'')}">+ ${esc(o)}</span>`).join('')); });
  const sc={};
  $$('.pk-tasks .task').forEach((card,i)=>bindTask(card,k.tasks[i],(tid,pts)=>{ sc[tid]=pts; markTask(tid,pts); }));
  if(timer){ pkTimer=setInterval(()=>{ const left=k.minutes*60-Math.floor((Date.now()-t0)/1000), c=$('#clock'); if(!c){ clearInterval(pkTimer); return; } if(left<=0){ c.textContent='Zeit um'; c.classList.add('over'); clearInterval(pkTimer); return; } c.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`; },1000); CLEANUP.push(()=>clearInterval(pkTimer)); }
  $('#pkfin').addEventListener('click',()=>{
    clearInterval(pkTimer); $('.pk-exam').classList.remove('ernst');
    $$('.pk-tasks .task').forEach((card,i)=>{ const tid=card.dataset.tid, tx=$('textarea',card).value.trim();
      if(tx.split(/\s+/).length>=5) $('.chkbtn',card).click(); else { sc[tid]=0; $('.task-fb',card).innerHTML='<p class="fb-note">Nicht bearbeitet.</p>'; }
      const sb=$('.solbtn',card); sb.hidden=false; sb.disabled=false; });
    const got=k.tasks.reduce((a,t,i)=>a+(sc[`pk-${k.id}-${i}`]||0),0), pct=Math.round(got/tot*100);
    $('#pkres').innerHTML=`<div class="summary panel"><p class="big-num">${got} / ${tot}</p><h2>${pct>=80?'Stark – das sitzt!':pct>=50?'Solide Grundlage. Vergleiche deine Antworten mit den Musterlösungen.':'Schau dir die Musterlösungen an und wiederhole die passenden Stationen.'}</h2>
      <table class="tbl res"><thead><tr><th>Aufgabe</th><th>Operator</th><th>Check</th></tr></thead><tbody>${k.tasks.map((t,i)=>{ const v=sc[`pk-${k.id}-${i}`]||0; return `<tr><td>${t.nr}</td><td>${esc((t.ops||[t.op]).join(' + '))}</td><td><span class="meter"><i style="width:${Math.round(v/t.p*100)}%"></i></span> ${v} von ${t.p}</td></tr>`; }).join('')}</tbody></table>
      <p class="fb-small">Der Check schätzt die Punkte anhand von Fachbegriffen und Kernaussagen. Unter jeder Aufgabe findest du jetzt Musterlösung und Erwartungshorizont.</p>
      <div class="row center"><a class="btn ghost" href="#/pk/${k.id}">Neu beginnen</a><a class="btn" href="#/probe">Zum Klausur-Simulator</a></div></div>`;
    $('#pkres').scrollIntoView({behavior:RM?'auto':'smooth'}); if(pct>=80) burst();
  });

function route(){
  cleanupScene(); const h=(location.hash||'#/').slice(2).split('/'); $$('.nav a').forEach(a=>a.removeAttribute('aria-current')); window.scrollTo(0,0); document.body.dataset.view=h[0]||'home'; document.body.style.removeProperty('--ch');
  if(h[0]==='k' && chById(h[1])) return renderChapter(chById(h[1]), STAGES.some(s=>s.k===h[2])?h[2]:'phaenomen');
  const nav=(p)=>{ const a=$(`.nav a[href="#/${p}"]`); if(a) a.setAttribute('aria-current','page'); };
  if(h[0]==='karten'){ nav('karten'); return renderCards(); }
  if(h[0]==='probe'){ nav('probe'); return renderProbeSetup(); }
  if(h[0]==='pk'){ const k=PROBEKLAUSUREN.find(x=>x.id===h[1]); if(k){ nav('probe'); return renderPK(k); } }
  if(h[0]==='operatoren'){ nav('operatoren'); return renderOperators(); }

  nav(''); renderHome(h[0]==='plan');
}

function initDive(){
  const sec=$('.dive'), L=$$('.dl',sec), N=DIVE.length; let last=-1, raf=0;
  const cap=(i)=>{ if(i===last) return; last=i; $('.dc-n',sec).textContent=DIVE[i].n; $('.dc-t',sec).textContent=DIVE[i].t; $('.sb-l',sec).textContent=DIVE[i].s; $$('.dive-gauge li',sec).forEach((li,k)=>li.classList.toggle('on',k<=i)); };
  if(RM){ sec.classList.add('static'); cap(0); return; }
  const upd=()=>{ raf=0; const r=sec.getBoundingClientRect(); const total=sec.offsetHeight-innerHeight; const p=Math.max(0,Math.min(1,-r.top/Math.max(1,total)))*(N-1+.35);
    L.forEach((el,i)=>{ const t=p-i, size=el.offsetWidth; let s,o,dx=0,dy=0;
      if(t<-1){ s=.1; o=0; } else if(t<0){ s=.1+.9*(1+t)*(1+t); o=Math.max(0,Math.min(1,(1+t)*1.8-.5)); if(i>0){ const [ox,oy]=DIVE[i-1].o; dx=(ox-.5)*size*(-t); dy=(oy-.5)*size*(-t); } } else { s=1+t*t*9; o=Math.max(0,1-Math.max(0,t-.2)*1.9); }
      if(i===N-1 && t>0){ s=1+t*.3; o=1; }
      el.style.transformOrigin=t>0?`${DIVE[i].o[0]*100}% ${DIVE[i].o[1]*100}%`:'50% 50%';
      el.style.opacity=o.toFixed(3); el.style.transform=`translate(calc(-50% + ${dx.toFixed(1)}px),calc(-50% + ${dy.toFixed(1)}px)) scale(${s.toFixed(3)})`; el.style.visibility=o<.01?'hidden':'visible'; });
    const ci=Math.max(0,Math.min(N-1,Math.round(p-.15))); cap(ci); sec.style.setProperty('--p',(p/(N-1)).toFixed(3));
    $('.dive-intro',sec).style.opacity=Math.max(0,1-p*2.2).toFixed(2); $('.dive-cap',sec).style.opacity=Math.min(1,p*3).toFixed(2); $('.dive-cue',sec).style.opacity=p>N-1.2?0:1; };
  const on=()=>{ if(!raf) raf=requestAnimationFrame(upd); };
  addEventListener('scroll',on,{passive:true}); addEventListener('resize',on); CLEANUP.push(()=>{ removeEventListener('scroll',on); removeEventListener('resize',on); cancelAnimationFrame(raf); }); upd();
}

    <header class="ch-head"><a class="back" href="#/plan">Tauchplan</a>
      <div class="ch-title"><span class="ch-nr" aria-hidden="true">${ch.nr}</span><div><p class="ch-depth"><span class="sbar"></span>Maßstab ${esc(ch.depth)}</p><h1>${esc(ch.title)}</h1><p class="ch-sub">${esc(ch.sub)}</p></div></div>
