  const intro=()=>{ const st=chStats(ch); body.innerHTML=`<div class="prac-intro panel"><h2>Üben in drei Stufen</h2><ul class="lvls">${[1,2,3].map(l=>`<li><span class="lv lv${l}">${LEVELNAMES[l]}</span> ${LVDESC[l]} <span class="muted">(${list.filter(x=>(x.item.lvl||1)===l).length} Aufgaben)</span></li>`).join('')}</ul><p class="small muted">Bei jeder Aufgabe helfen dir ein Tipp und die passende Infokarte. Gelöst: ${st.qD} von ${st.qT}.</p><button class="btn go">Quiz starten</button>${st.qD<st.qT&&st.qD>0?'<button class="btn ghost go-open">Nur offene Aufgaben</button>':''}</div><div class="qhost"></div>`;
    $('.go',body).addEventListener('click',()=>run(list)); const o=$('.go-open',body); if(o) o.addEventListener('click',()=>run(list.filter(x=>!S.solved[x.id]))); };
  const run=(l)=>{ $('.prac-intro',body).remove(); runQuiz($('.qhost',body),l,{onDone:(res)=>{ markStage(ch.id,'ueben'); const by=[1,2,3].map(lv=>{ const r=res.filter(x=>x.lvl===lv); return r.length?Math.round(r.reduce((a,x)=>a+x.score,0)/r.length*100):null; }); const wrong=res.filter(r=>r.score<1).map(r=>l.find(x=>x.id===r.id));
      const tot=Math.round(res.reduce((a,r)=>a+r.score,0)/res.length*100); if(tot>=80) burst();
      $('.qhost',body).innerHTML=`<div class="summary panel"><p class="big-num">${tot} %</p><h2>${tot>=80?'Stark! Bereit für Klausuraufgaben.':tot>=50?'Gute Basis. Wiederhole die markierten Stufen.':'Schau dir die Infokarten noch einmal an und versuch es erneut.'}</h2>
        <ul class="lvls res">${by.map((v,k)=>v==null?'':`<li><span class="lv lv${k+1}">${LEVELNAMES[k+1]}</span><span class="meter"><i style="width:${v}%"></i></span> ${v} %</li>`).join('')}</ul>
        <div class="row center">${wrong.length?'<button class="btn ghost again">Falsche Aufgaben wiederholen</button>':''}<a class="btn" href="#/k/${ch.id}/klausur">Weiter: Klausur</a></div></div>`;
      const a=$('.again',body); if(a) a.addEventListener('click',()=>run(wrong)); }}); };
  intro();
}
function stExam(ch,body){
  body.innerHTML=`<div class="exam-intro panel"><h2>Klausuraufgaben</h2><p>Schreibe in ganzen Sätzen. Der Operator verrät, was verlangt ist – tippe ihn an. Wenn du feststeckst: Hilfe 1 gibt einen Denkanstoß, Hilfe 2 die Struktur, Hilfe 3 Satzanfänge. Nach dem Check siehst du die Musterlösung.</p>
    <p class="afb-l"><span class="afb">AFB I</span> Reproduktion <span class="afb">AFB II</span> Reorganisation und Transfer <span class="afb">AFB III</span> Reflexion und Problemlösung</p></div>`+
    ch.klausur.map((t,i)=>taskCard(ch,t,i,taskId(ch.id,i))).join('');
  $$('.task',body).forEach((card,i)=>bindTask(card,ch.klausur[i],(tid,pts)=>{ markTask(tid,pts); markStage(ch.id,'klausur'); }));
}
function stSecure(ch,body){
  const s=ch.sicherung, pv=S.poll[ch.id], p=s.crit.reduce((a,c)=>a+c.p,0);
  const task={op:'Erklären',p,q:s.q,crit:s.crit,model:s.model,hilfen:s.hilfen||['Lies deine Infokarten dieser Station noch einmal durch.','Gehe vom Phänomen aus: Was passiert – und welcher Fachbegriff erklärt es?','Satzanfänge: „Das Phänomen lässt sich so erklären: …“ – „Der Grund ist, dass …“ – „Daher …“']};
  const cardIds=[...new Set(ch.explore.filter(e=>e.t==='cards').flatMap(e=>e.ids))];
  const ik=S.ichkann[ch.id]||{};
  body.innerHTML=`<div class="back-to panel"><p class="small muted">Zurück zum Rätsel</p><h2>${esc(ch.hook.title)}</h2>${pv!=null?`<p>Deine erste Vermutung war: <em>„${esc(ch.hook.poll.o[pv])}“</em>. Stimmt sie noch? Antworte jetzt mit Fachwissen.</p>`:'<p>Erkläre das Rätsel vom Anfang jetzt mit deinem neuen Fachwissen.</p>'}</div>
    ${taskCard(ch,task,0,'sich-'+ch.id)}
    <div class="merke panel" ${S.done['sich-'+ch.id]?'':'hidden'}><h3>Merksatz</h3><p>${s.merke}</p></div>
    <section class="ichkann panel"><h3>Ich kann …</h3><p class="small muted">Schätze dich ehrlich ein. Bei Gelb oder Rot: Karteikarten unten wiederholen.</p>
      <ul>${s.ichkann.map((t,i)=>`<li data-i="${i}"><span>${esc(t)}</span><span class="ampel" role="radiogroup" aria-label="Selbsteinschätzung">${['g','y','r'].map(c=>`<button class="am-${c}" data-v="${c}" role="radio" aria-checked="${ik[i]===c}" aria-label="${{g:'sicher',y:'teilweise',r:'noch unsicher'}[c]}"></button>`).join('')}</span></li>`).join('')}</ul></section>
    <section class="xb"><header class="xb-h"><h2>Wiederholen</h2></header><div class="cards">${cardIds.map(id=>cardHTML(id,false)).join('')}</div></section>
    <div class="station-end panel">${chStats(ch).badge?'<p class="badge big">Station gemeistert</p>':''}<p class="small muted">Für „gemeistert“: 75 % der Quizaufgaben, die Hälfte der Klausurpunkte und die Leitfrage beantwortet.</p></div>`;
  const card=$('.task',body); bindTask(card,task,(tid,pts)=>{ markStage(ch.id,'sicherung'); if(pts>=Math.ceil(p/2)){ markDone(tid,30); $('.merke',body).hidden=false; burst(); } else toast('Ergänze deine Antwort – der Merksatz erscheint, wenn die Kernpunkte drin sind.'); });
  bindCards(body);
  $$('.ichkann li',body).forEach(li=>$$('button',li).forEach(b=>b.addEventListener('click',()=>{ S.ichkann[ch.id]=S.ichkann[ch.id]||{}; S.ichkann[ch.id][li.dataset.i]=b.dataset.v; save(); $$('button',li).forEach(x=>x.setAttribute('aria-checked',x===b)); })));
}

/* ---------- Karteikasten ---------- */
function renderCards(){
  const groups=CHAPTERS.map(ch=>({ch,ids:[...new Set(ch.explore.filter(e=>e.t==='cards').flatMap(e=>e.ids))]}));
  const used=new Set(groups.flatMap(g=>g.ids)); const rest=Object.keys(CARDS).filter(k=>!used.has(k));
  if(rest.length) groups.push({ch:{id:'extra',nr:'+',title:'Aus den 3D-Modellen',color:'#9FC1C7'},ids:rest});
  let filter='all', mode='grid';
  $('#main').innerHTML=`<section class="plain wide"><h1 class="sec-t">Karteikasten</h1><p class="lead">Erst die Frage lesen und eine Antwort überlegen – dann umdrehen. So merkst du dir am meisten.</p>
    <div class="ctrl-row kk-f"><button class="chip-btn" data-f="all" aria-pressed="true">Alle</button>${groups.map(g=>`<button class="chip-btn" data-f="${g.ch.id}" aria-pressed="false" style="--c:${g.ch.color}"><i style="background:${g.ch.color}"></i>${esc(g.ch.title)}</button>`).join('')}</div>
    <div class="ctrl-row"><button class="btn small ghost mode">Abfrage-Modus</button><span class="small muted">Umgedreht: ${Object.keys(S.flipped).length} von ${Object.keys(CARDS).length}</span></div><div class="kk"></div></section>`;
  const pool=()=>groups.filter(g=>filter==='all'||g.ch.id===filter);
  const draw=()=>{ const k=$('.kk');
    if(mode==='grid'){ k.innerHTML=pool().map(g=>`<h2 class="kk-h" style="--c:${g.ch.color}"><span>${g.ch.nr}</span>${esc(g.ch.title)}</h2><div class="cards" style="--c:${g.ch.color}">${g.ids.map(id=>cardHTML(id,false)).join('')}</div>`).join(''); bindCards(k); return; }
    let deck=shuffle(pool().flatMap(g=>g.ids)), i=0, know=0;
    const one=()=>{ if(i>=deck.length){ k.innerHTML=`<div class="summary panel"><p class="big-num">${know}/${deck.length}</p><h2>gewusst</h2><button class="btn again">Neue Runde</button></div>`; $('.again',k).addEventListener('click',draw); return; }
      k.innerHTML=`<div class="drill"><p class="small muted">Karte ${i+1} von ${deck.length}</p>${cardHTML(deck[i],false)}<div class="row center dr-b" hidden><button class="btn ghost no">Noch nicht</button><button class="btn yes">Gewusst</button></div></div>`; bindCards(k);
      $('.fc-inner',k).addEventListener('click',()=>{ $('.dr-b',k).hidden=false; },{once:true});
      $('.no',k).addEventListener('click',()=>{ deck.push(deck[i]); i++; one(); }); $('.yes',k).addEventListener('click',()=>{ know++; i++; one(); }); };
    one(); };
  $$('.kk-f .chip-btn').forEach(b=>b.addEventListener('click',()=>{ filter=b.dataset.f; $$('.kk-f .chip-btn').forEach(x=>x.setAttribute('aria-pressed',x===b)); draw(); }));
  $('.mode').addEventListener('click',function(){ mode=mode==='grid'?'drill':'grid'; this.textContent=mode==='grid'?'Abfrage-Modus':'Alle Karten zeigen'; draw(); });
  draw();
}

/* ---------- Klausur-Simulator ---------- */
let timerInt=null;
function renderProbeSetup(){
  clearInterval(timerInt); const act=CHAPTERS.filter(c=>S.active.includes(c.id));
  $('#main').innerHTML=`<section class="plain probe"><h1 class="sec-t">Klausur-Simulator</h1>
    <p class="lead">Eine gemischte Probeklausur aus den Stationen deines Missionsplans: erst Quizaufgaben, dann schreibst du Klausuraufgaben – ohne Hilfen, wie im Ernstfall.</p>
    ${act.length?`<div class="panel"><p><strong>Deine Stationen:</strong></p><ul class="pt-list">${act.map(c=>`<li style="--c:${c.color}"><span>${c.nr}</span>${esc(c.title)}</li>`).join('')}</ul><a href="#/plan">Missionsplan ändern</a></div>
    <fieldset class="probe-opts panel"><legend>Umfang</legend>
      <label><input type="radio" name="len" value="s" checked> Kurz: 8 Quizaufgaben und 1 Klausuraufgabe (ca. 20 min)</label>
      <label><input type="radio" name="len" value="l"> Lang: 14 Quizaufgaben und 3 Klausuraufgaben (ca. 45 min)</label>
      <label><input type="checkbox" id="tmr" checked> Mit Countdown</label></fieldset><button class="btn" id="go">Probeklausur starten</button>`:`<p class="fb-note">Dein Missionsplan ist leer. <a href="#/plan">Wähle Stationen im Tauchplan aus.</a></p>`}${probeCards()}</section>`;
  const go=$('#go'); if(go) go.addEventListener('click',()=>startProbe(act,$('input[name=len]:checked').value==='l',$('#tmr').checked));
}
function startProbe(act,long,timer){
  const nq=long?14:8, nt=long?3:1;
  const pool=[]; act.forEach(ch=>ch.quiz.forEach((item,i)=>pool.push({item,id:itemId(ch.id,i),cid:ch.id})));
  const per={}; shuffle(pool).forEach(p=>(per[p.cid]=per[p.cid]||[]).push(p));
  const qs=[]; let r=0; while(qs.length<Math.min(nq,pool.length)){ const ks=Object.keys(per).filter(k=>per[k].length); if(!ks.length) break; qs.push(per[ks[r%ks.length]].shift()); r++; }
  qs.sort((a,b)=>(a.item.lvl||1)-(b.item.lvl||1));
  const tp=[]; act.forEach(ch=>ch.klausur.forEach((t,i)=>tp.push({ch,t,i}))); const tb={}; shuffle(tp).forEach(x=>(tb[x.ch.id]=tb[x.ch.id]||[]).push(x));
  const ts=[]; const ord=shuffle(Object.keys(tb)); let j=0; while(ts.length<Math.min(nt,tp.length)){ const k=ord[j%ord.length]; if(tb[k].length) ts.push(tb[k].shift()); j++; }
  const minutes=long?45:20, t0=Date.now();
  $('#main').innerHTML=`<section class="plain probe"><div class="probe-bar"><h1 class="sec-t sm">Probeklausur</h1>${timer?`<span class="clock" id="clock">${minutes}:00</span>`:''}</div><div id="ppane"></div></section>`;
  if(timer){ timerInt=setInterval(()=>{ const left=minutes*60-Math.floor((Date.now()-t0)/1000), c=$('#clock'); if(!c){ clearInterval(timerInt); return; } if(left<=0){ c.textContent='Zeit um'; c.classList.add('over'); clearInterval(timerInt); return; } c.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`; },1000); CLEANUP.push(()=>clearInterval(timerInt)); }
  runQuiz($('#ppane'),qs,{onDone:(qres)=>{ const pane=$('#ppane'), sc={};
    pane.innerHTML=`<h2 class="h2">Teil 2: Klausuraufgaben</h2><p class="panel small">Schreibe deine Antworten und prüfe sie. Danach geht es zur Gesamtauswertung.</p>`+ts.map(({ch,t,i})=>`<p class="from" style="--c:${ch.color}">aus Station ${ch.nr}: ${esc(ch.title)}</p>`+taskCard(ch,t,i,taskId(ch.id,i),'probe')).join('')+`<div class="pane-end"><button class="btn" id="fin">Probeklausur auswerten</button></div>`;
    $$('.task',pane).forEach((card,k)=>bindTask(card,ts[k].t,(tid,pts)=>{ sc[tid]=pts; markTask(tid,pts); }));
    $('#fin').addEventListener('click',()=>{ $$('.task',pane).forEach((card,k)=>{ const tid=card.dataset.tid; if(sc[tid]===undefined){ const tx=$('textarea',card).value; sc[tid]=tx.trim()?evalTask(ts[k].t,tx).pts:0; markTask(tid,sc[tid]); } }); clearInterval(timerInt); probeResult(qres,ts,sc); }); }});
}
function probeResult(qres,ts,sc){
  const qP=qres.reduce((a,r)=>a+r.score,0), qM=qres.length, tP=ts.reduce((a,x)=>a+(sc[taskId(x.ch.id,x.i)]||0),0), tM=ts.reduce((a,x)=>a+x.t.p,0);
  const pct=Math.round(((qM?qP/qM:0)*.5+(tM?tP/tM:0)*.5)*100); const per={};
  qres.forEach(r=>{ per[r.cid]=per[r.cid]||{s:0,n:0}; per[r.cid].s+=r.score; per[r.cid].n++; }); ts.forEach(x=>{ per[x.ch.id]=per[x.ch.id]||{s:0,n:0}; per[x.ch.id].s+=(sc[taskId(x.ch.id,x.i)]||0)/x.t.p; per[x.ch.id].n++; });
  const weak=Object.entries(per).filter(([,v])=>v.s/v.n<.6).map(([k])=>chById(k));
  if(!S.probeDone){ S.probeDone=true; save(); addXP(40); }
  $('#ppane').innerHTML=`<div class="summary panel"><p class="big-num">${pct} %</p><h2>${pct>=80?'Bereit für die Klausur!':pct>=55?'Solide – ein paar Stationen brauchen noch Feinschliff.':'Da geht noch was. Tauche in die markierten Stationen ein.'}</h2>
    <p class="muted">Quiz: ${(Math.round(qP*10)/10).toLocaleString('de-DE')} von ${qM} · Klausuraufgaben: ${tP} von ${tM} Punkten (Check-Schätzung)</p>
    <table class="tbl res"><thead><tr><th>Station</th><th>Ergebnis</th></tr></thead><tbody>${Object.entries(per).map(([k,v])=>`<tr><td><a href="#/k/${k}/ueben">${esc(chById(k).title)}</a></td><td><span class="meter"><i style="width:${Math.round(v.s/v.n*100)}%"></i></span> ${Math.round(v.s/v.n*100)} %</td></tr>`).join('')}</tbody></table>
    ${weak.length?`<p><strong>Noch einmal eintauchen:</strong> ${weak.map(c=>`<a href="#/k/${c.id}/entdecken">${esc(c.title)}</a>`).join(', ')}</p>`:''}
    <div class="row center"><a class="btn ghost" href="#/probe">Neue Probeklausur</a><a class="btn" href="#/plan">Zum Tauchplan</a></div></div>`;
  if(pct>=80) burst();
}

/* ---------- Operatoren & Lehrkraft ---------- */
function renderOperators(){
  $('#main').innerHTML=`<section class="plain"><h1 class="sec-t">Operatoren</h1><p class="lead">Der Operator am Anfang einer Klausuraufgabe sagt dir, was du tun sollst. Wer ihn genau umsetzt, holt die Punkte.</p>
    <dl class="ops">${Object.entries(OPERATORS).map(([k,v])=>`<div class="panel"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
    <h2 class="h2">Tipps für Klausurantworten</h2><ul class="tips"><li>Ganze Sätze, Fachbegriffe korrekt verwenden.</li><li>Bei „Erklären“ den Zusammenhang deutlich machen: weil, dadurch, deshalb.</li><li>Material (Abbildungen, Werte) ausdrücklich nutzen und benennen.</li><li>Beim Berechnen: Formel, Einsetzen, Ergebnis mit Einheit.</li><li>Modelle immer als Modelle benennen – mit dem, was sie zeigen, und ihren Grenzen.</li></ul></section>`;
}
function renderTeacher(){
  const base=location.href.split('?')[0].split('#')[0];
  const nQ=CHAPTERS.reduce((a,c)=>a+c.quiz.length,0), nK=CHAPTERS.reduce((a,c)=>a+c.klausur.length,0), nM=CHAPTERS.reduce((a,c)=>a+c.explore.filter(e=>e.t==='mod').length,0);
  $('#main').innerHTML=`<section class="plain"><h1 class="sec-t">Für Lehrkräfte</h1>
    <p class="lead">Erzeuge einen Link, der für deine Lerngruppe genau die Stationen in den Missionsplan setzt, die ihr schon behandelt habt. Die Schüler:innen können die Auswahl danach selbst ändern.</p>
    <ul class="mis panel">${CHAPTERS.map(c=>`<li><label><input type="checkbox" data-l="${c.id}" ${S.active.includes(c.id)?'checked':''}><span style="--c:${c.color}">${c.nr}</span> ${esc(c.title)} <small class="muted">– ${esc(c.sub)}</small></label></li>`).join('')}</ul>
    <div class="row"><input id="lnk" readonly aria-label="Link für die Lerngruppe"><button class="btn small" id="cp">Link kopieren</button></div>
    <div class="panel small"><p><strong>Inhalt:</strong> ${CHAPTERS.length} Stationen, ${nM} interaktive Module, ${Object.keys(CARDS).length} Infokarten, ${nQ} Quizaufgaben (Basis / Anwenden / Transfer), ${nK} Klausuraufgaben mit je drei gestuften Hilfen und Erwartungshorizont.</p>
    <p><strong>Lehrplanbezug:</strong> KLP Biologie SII NRW (2022), EF Inhaltsfeld 1 Zellbiologie – Pro-/Eukaryoten, Kompartimentierung, Endosymbiontentheorie, Zelldifferenzierung, Biomoleküle, Biomembran (Modelle, Transport, Signaltransduktion, Zell-Zell-Erkennung), Diffusion und Osmose, Homöostase, osmotische Versuche.</p>
    <p><strong>Datenschutz:</strong> Der Fortschritt wird nur im Browser des Geräts gespeichert (localStorage). Es werden keine Daten an einen Server übertragen.</p>
    <p><strong>Hinweis zum Antwort-Check:</strong> Er sucht nach Fachbegriffen und Kernaussagen und ersetzt keine Korrektur.</p></div></section>`;
  const upd=()=>{ $('#lnk').value=base+'?themen='+$$('input[data-l]').filter(c=>c.checked).map(c=>c.dataset.l).join(','); };
  $$('input[data-l]').forEach(c=>c.addEventListener('change',upd)); upd();
  $('#cp').addEventListener('click',()=>{ const v=$('#lnk').value; (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Link kopiert')).catch(()=>{ $('#lnk').select(); document.execCommand('copy'); toast('Link kopiert'); }); });
}

/* ---------- Start ---------- */
document.addEventListener('DOMContentLoaded',()=>{
  renderHeaderXP(); route();
  $('#reset').addEventListener('click',()=>{ if(confirm('Wirklich den gesamten Fortschritt (Punkte, Antworten, Missionsplan) löschen?')){ S=defaults(); save(); renderHeaderXP(); location.hash='#/'; route(); } });
});
