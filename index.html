<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tauchgang Zelle – Biologie EF</title>
<meta name="description" content="Interaktive Lernplattform Zellbiologie für die Einführungsphase (Gymnasium NRW): 3D-Modelle, Versuche, Infokarten, Quiz und Klausuraufgaben.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='17' fill='%2303111C' stroke='%2346F0D2' stroke-width='3'/%3E%3Ccircle cx='17' cy='18' r='6' fill='%23A894FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Tauchgang Zelle – Design: Fluoreszenz im Tiefenwasser ===== */
:root{
  --abyss:#03111C; --deep:#061B2B; --ink:#0A2438; --panel:rgba(10,36,56,.66); --panel2:rgba(16,50,74,.72); --edge:rgba(140,230,235,.16); --edge2:rgba(140,230,235,.30);
  --text:#EAF6F7; --text2:#9FC1C7; --cyan:#46F0D2; --pink:#FF5A9E; --amber:#FFB84D; --lilac:#A894FF; --green:#7BE36A; --blue:#5EC8FF; --red:#FF6B6B;
  --display:'Syne', 'Trebuchet MS', sans-serif; --body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --c:var(--cyan); --r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important} }
body{margin:0;font:400 1.0625rem/1.6 var(--body);color:var(--text);background:var(--abyss);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(1200px 700px at 80% -10%,rgba(70,240,210,.10),transparent 60%),radial-gradient(900px 700px at -10% 30%,rgba(94,120,255,.10),transparent 60%),linear-gradient(180deg,#05192A 0%,#03111C 45%,#020A12 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;background-image:radial-gradient(1.2px 1.2px at 12% 18%,rgba(234,246,247,.55),transparent 60%),radial-gradient(1px 1px at 72% 28%,rgba(234,246,247,.45),transparent 60%),radial-gradient(1.5px 1.5px at 38% 74%,rgba(70,240,210,.5),transparent 60%),radial-gradient(1px 1px at 88% 82%,rgba(234,246,247,.4),transparent 60%),radial-gradient(1.3px 1.3px at 22% 52%,rgba(234,246,247,.35),transparent 60%),radial-gradient(1px 1px at 56% 8%,rgba(234,246,247,.4),transparent 60%);background-size:520px 520px;animation:snow 60s linear infinite}
@keyframes snow{to{background-position:0 520px}}
a{color:var(--cyan)} a:hover{color:#9FFBE9}
h1,h2,h3,h4{font-family:var(--display);line-height:1.12;margin:0 0 .5em;letter-spacing:-.01em}
h2{font-size:1.6rem} h3{font-size:1.2rem} h4{font-size:1.05rem}
p{margin:0 0 .8em}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--text2)} .small{font-size:.92rem} .center{justify-content:center;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:18px 20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lead{font-size:1.18rem;color:var(--text2);max-width:62ch}
.sec-t{font:800 clamp(2.2rem,5vw,3.6rem)/1 var(--display);letter-spacing:-.03em;margin:0 0 .35em}
.sec-t.sm{font-size:2rem}
.h2{margin-top:28px}
.qhost,#ppane,.task{scroll-margin-top:90px}

/* ---------- Kopfzeile ---------- */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:22px;padding:10px clamp(14px,3vw,34px);background:rgba(3,17,28,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--edge)}
.logo{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font:800 1.15rem var(--display);letter-spacing:-.01em;white-space:nowrap}
.logo svg{width:34px;height:34px}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav a{color:var(--text2);text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:700;font-size:.95rem;white-space:nowrap}
.nav a:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav a[aria-current="page"]{color:var(--abyss);background:var(--cyan)}
#xp{display:flex;align-items:center;gap:12px;min-width:210px}
.xp-text{display:flex;flex-direction:column;line-height:1.15;text-align:right;flex:1}
.xp-text strong{font:700 .95rem var(--display);color:var(--cyan)} .xp-text span{font-size:.78rem;color:var(--text2)}
.xp-bar{width:70px;height:7px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.xp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:9px;transition:width .6s}
main{display:block;min-height:70vh}
.foot{padding:40px clamp(14px,3vw,34px);color:var(--text2);font-size:.9rem;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--edge);margin-top:80px}
.foot button{background:none;border:0;color:var(--text2);text-decoration:underline;cursor:pointer;font:inherit}

/* ---------- Buttons & Steuerung ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 1rem var(--body);padding:12px 22px;border-radius:999px;border:2px solid var(--c);background:var(--c);color:var(--abyss);cursor:pointer;text-decoration:none;transition:filter .2s,transform .1s}
.btn:hover{filter:brightness(1.12);color:var(--abyss)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--c)} .btn.ghost:hover{background:rgba(255,255,255,.06);color:var(--text)}
.btn.small{padding:8px 15px;font-size:.92rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--c);font:700 .92rem var(--body);cursor:pointer;text-decoration:underline;padding:4px}
.ctrl-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.seg-row{display:flex;gap:6px;flex-wrap:wrap}
.seg-btn,.chip-btn{font:700 .92rem var(--body);color:var(--text);background:rgba(255,255,255,.04);border:1.5px solid var(--edge2);border-radius:999px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.seg-btn:hover,.chip-btn:hover{border-color:var(--c)}
.seg-btn[aria-pressed="true"],.chip-btn[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--abyss)}
.chip-btn{font-size:.86rem;padding:6px 12px} .chip-btn i{width:11px;height:11px;border-radius:50%;display:inline-block}
.ctl-l{font-weight:700;color:var(--text2);font-size:.88rem;margin:12px 0 6px}
.slider-l{display:flex;align-items:center;gap:12px;font-weight:700;color:var(--text2)} .slider-l.wide{flex:1;min-width:240px} .slider-l.wide input{flex:1}
input[type=range]{accent-color:var(--c);min-width:160px}

/* ---------- Tauchgang (Startseite) ---------- */
.dive{position:relative;height:620vh}
.dive-stage{position:sticky;top:0;height:100vh;overflow:hidden;background:radial-gradient(circle at 64% 52%,rgba(70,240,210,calc(.05 + var(--p,0)*.12)),transparent 55%)}
.dive-layers{position:absolute;inset:0}
.dive-stage::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(3,17,28,.92) 0%,rgba(3,17,28,.7) 26%,rgba(3,17,28,0) 46%)}
.dive-gauge,.dive-cue{z-index:2}
.dl{position:absolute;left:64%;top:53%;width:min(78vh,56vw);aspect-ratio:1;transform:translate(-50%,-50%) scale(.15);opacity:0;will-change:transform,opacity}
.dl:first-child{opacity:1;transform:translate(-50%,-50%)}
.dl svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 30px rgba(70,240,210,.12))}
.dl-n{display:none}
.dv-t{font:800 26px var(--display);fill:#fff} .dv-s{font:700 17px var(--body);fill:var(--text)}
.dive-intro{position:absolute;left:clamp(18px,5vw,72px);top:16vh;max-width:min(560px,40vw);z-index:2}
.hero-t{font:800 clamp(3.4rem,9.5vw,8.6rem)/.86 var(--display);letter-spacing:-.045em;margin:0 0 .3em;color:var(--text);text-shadow:0 0 50px rgba(70,240,210,.25)}
.hero-l{font-size:clamp(1.05rem,1.6vw,1.3rem);color:var(--text2);max-width:34ch}
.skip{display:inline-block;margin-top:8px;font-weight:700;color:var(--cyan)}
.dive-cap{position:absolute;left:clamp(18px,5vw,72px);bottom:20vh;max-width:min(420px,36vw);opacity:0;z-index:2}
.dc-n{font:800 clamp(1.8rem,3.4vw,3rem)/1 var(--display);letter-spacing:-.03em;margin:0 0 .35em;color:var(--cyan)}
.dc-t{color:var(--text);font-size:1.08rem}
.dive-scale{position:absolute;left:clamp(18px,5vw,72px);bottom:9vh;display:flex;flex-direction:column;gap:6px;z-index:2}
.sb{display:block;width:96px;height:7px;background:var(--text);border-radius:2px;box-shadow:0 0 14px rgba(234,246,247,.4)}
.sb-l{font:800 1.4rem var(--display);letter-spacing:-.01em}
.dive-gauge{position:absolute;right:clamp(14px,3vw,40px);top:50%;transform:translateY(-50%);list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--edge2);display:flex;flex-direction:column;gap:clamp(18px,4.5vh,44px)}
.dive-gauge li{position:relative;font:700 .85rem var(--body);color:rgba(159,193,199,.5);transition:color .3s}
.dive-gauge li::before{content:"";position:absolute;left:-25px;top:.45em;width:12px;height:12px;border-radius:50%;background:var(--abyss);border:2px solid var(--edge2);transition:all .3s}
.dive-gauge li.on{color:var(--text)} .dive-gauge li.on::before{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.dive-cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);margin:0;font-size:.85rem;color:var(--text2);transition:opacity .4s;padding-bottom:30px}
.dive-cue::after{content:"";position:absolute;left:50%;bottom:0;width:2px;height:24px;background:linear-gradient(var(--cyan),transparent);animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%{transform:translateY(-8px);opacity:0}50%{opacity:1}100%{transform:translateY(6px);opacity:0}}
.dive.static{height:auto} .dive.static .dive-stage{position:relative;height:auto;padding:10vh 5vw 6vh;display:flex;flex-direction:column} .dive.static .dive-intro{order:-1} .dive.static .dl{overflow:hidden}
.dive.static .dive-layers{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
.dive.static .dl{position:relative;left:auto;top:auto;width:100%;opacity:1;transform:none}
.dive.static .dl-n{display:block;text-align:center;font-weight:700;margin-top:6px}
.dive.static .dive-intro,.dive.static .dive-stage::after{display:none} .dive.static .dive-cap,.dive.static .dive-scale{position:relative;left:auto;top:auto;bottom:auto;max-width:none;opacity:1}
.dive.static .dive-stage::after{display:none} .dive.static .dive-cap,.dive.static .dive-scale,.dive.static .dive-gauge,.dive.static .dive-cue{display:none}

/* ---------- Tauchplan ---------- */
.plan{max-width:1240px;margin:0 auto;padding:12vh clamp(16px,4vw,40px) 40px;scroll-margin-top:60px}
.plan-head{margin-bottom:36px}
.plan-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
.route{list-style:none;margin:0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:139px;top:20px;bottom:20px;width:2px;background:linear-gradient(180deg,var(--cyan),var(--pink) 30%,var(--amber) 45%,var(--lilac) 60%,var(--blue) 75%,var(--green) 88%,#4FD8FF);opacity:.55}
.rt{display:grid;grid-template-columns:118px 42px minmax(0,1fr);align-items:center;margin-bottom:18px}
.rt-depth{font:700 .82rem var(--body);color:var(--text2);text-align:right;padding-right:14px;line-height:1.3}
.rt-node{display:grid;place-items:center} .rt-node i{width:18px;height:18px;border-radius:50%;background:var(--abyss);border:3px solid var(--c);box-shadow:0 0 0 5px rgba(3,17,28,1),0 0 18px var(--c)}
.rt-card{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;text-decoration:none;color:var(--text);padding:18px 22px;border-radius:22px;background:var(--panel);border:1px solid var(--edge);transition:border-color .25s,background .25s}
.rt-card:hover{border-color:var(--c);background:var(--panel2);color:var(--text)}
.rt-nr{font:800 3.4rem/.9 var(--display);color:var(--c);letter-spacing:-.04em;min-width:1.2ch}
.rt-body{display:flex;flex-direction:column;gap:2px}
.rt-t{font:800 1.35rem var(--display);letter-spacing:-.01em}
.rt-sub{color:var(--text2)} .rt-hook{font-size:.92rem;color:var(--c);margin-top:4px}
.rt-prog{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.stg{display:flex;gap:4px} .stg i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.12)} .stg i.on{background:var(--c)}
.meter{display:inline-block;width:110px;height:7px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--c);border-radius:9px}
.pc{font-size:.85rem;color:var(--text2)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(255,184,77,.16);color:var(--amber);font-weight:700;font-size:.82rem;border:1px solid rgba(255,184,77,.5)}
.badge::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.badge.big{font-size:1.1rem;padding:8px 16px}
.tag-off{font-size:.8rem;color:var(--text2);border:1px dashed var(--edge2);padding:2px 8px;border-radius:999px}
.rt.off .rt-card{opacity:.5} .rt.off .rt-node i{border-color:var(--text2);box-shadow:0 0 0 5px var(--abyss)}
.plan-side{display:flex;flex-direction:column;gap:16px;position:sticky;top:80px}
.mis{list-style:none;margin:10px 0 0;padding:0}
.mis li{margin:6px 0} .mis label{display:flex;align-items:center;gap:10px;cursor:pointer}
.mis input{width:18px;height:18px;accent-color:var(--cyan)}
.mis span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--c);color:var(--abyss);font:800 .8rem var(--display)}
.how-l{margin:8px 0 0;padding-left:1.3em} .how-l li{margin:8px 0} .how-l b{display:block} .how-l span{color:var(--text2);font-size:.92rem}
.cta{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--text);border-color:rgba(70,240,210,.45);background:linear-gradient(135deg,rgba(70,240,210,.16),rgba(10,36,56,.7))}
.cta b{font:800 1.25rem var(--display);color:var(--cyan)} .cta span{color:var(--text2)} .cta:hover{color:var(--text);border-color:var(--cyan)}
.cta.alt{border-color:rgba(168,148,255,.4);background:linear-gradient(135deg,rgba(168,148,255,.16),rgba(10,36,56,.7))} .cta.alt b{color:var(--lilac)}

/* ---------- Kapitel ---------- */
.chap{max-width:1180px;margin:0 auto;padding:26px clamp(16px,4vw,40px) 40px}
.back{display:inline-block;font-weight:700;color:var(--text2);text-decoration:none;margin-bottom:16px} .back::before{content:"‹ "} .back:hover{color:var(--text)}
.ch-title{display:flex;gap:22px;align-items:center;margin-bottom:22px}
.ch-nr{font:800 clamp(5rem,12vw,9rem)/.8 var(--display);color:transparent;-webkit-text-stroke:2px var(--c);letter-spacing:-.06em;text-shadow:0 0 40px color-mix(in srgb,var(--c) 35%,transparent)}
.ch-title h1{font:800 clamp(2.1rem,5vw,3.6rem)/1 var(--display);letter-spacing:-.03em;margin:4px 0 6px}
.ch-sub{color:var(--text2);font-size:1.1rem;margin:0}
.ch-depth{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.88rem;color:var(--c);margin:0}
.sbar{display:inline-block;width:42px;height:5px;border-radius:2px;background:var(--c)}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative;margin:8px 0 18px;counter-reset:s}
.stages::before{content:"";position:absolute;left:10%;right:10%;top:19px;height:2px;background:var(--edge2)}
.stg-a{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--text2);font-weight:700;font-size:.92rem;padding:0 4px}
.stg-n{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--abyss);border:2px solid var(--edge2);font:800 1rem var(--display);color:var(--text2);transition:all .25s;position:relative;z-index:1}
.stg-a.done .stg-n{border-color:var(--c);color:var(--c)}
.stg-a.done .stg-n::after{content:"";position:absolute;right:-3px;top:-3px;width:13px;height:13px;border-radius:50%;background:var(--c);border:2px solid var(--abyss)}
.stg-a[aria-current="step"]{color:var(--text)} .stg-a[aria-current="step"] .stg-n{background:var(--c);border-color:var(--c);color:var(--abyss);box-shadow:0 0 22px color-mix(in srgb,var(--c) 60%,transparent)}
.stg-a:hover{color:var(--text)}
.leit-bar{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin:0;padding:12px 18px;border-radius:14px;background:color-mix(in srgb,var(--c) 10%,transparent);border-left:5px solid var(--c);font-weight:700;font-size:1.05rem}
.leit-bar span{font-size:.82rem;color:var(--c);font-weight:700}
.ch-body{margin-top:34px}
.ch-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:56px;padding-top:24px;border-top:1px solid var(--edge)}

/* Phänomen */
.phaen{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:34px;align-items:center}
.hook-art{margin:0;border-radius:26px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--c) 14%,transparent),rgba(3,17,28,.4) 70%);border:1px solid var(--edge);padding:12px}
.art{width:100%;height:auto;display:block}
.art-t{font:700 15px var(--body);fill:var(--text2)} .art-q{font:800 46px var(--display);fill:var(--amber)}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.09)}30%{transform:scale(.98)}45%{transform:scale(1.05)}}
.float-up{animation:fup 3.6s ease-in infinite} @keyframes fup{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
.fall{animation:fall 2.4s ease-in infinite} @keyframes fall{0%{transform:translateY(-10px);opacity:0}20%{opacity:1}100%{transform:translateY(50px);opacity:0}}
.wave{stroke-dasharray:12 10;animation:flow 1.6s linear infinite}
.hook-txt h2{font-size:clamp(1.7rem,3.2vw,2.5rem);letter-spacing:-.02em}
.hook-p{font-size:1.15rem;max-width:58ch}
.poll{margin-top:18px} .poll-q{font:700 1.05rem var(--display);margin-bottom:10px}
.poll-fb{color:var(--c);margin:8px 0 0;min-height:1.2em}
.leit{margin-top:30px;transition:opacity .3s}
.leit.locked{opacity:.4;pointer-events:none;position:relative}
.leit.locked::after{content:"Gib zuerst oben deine Vermutung ab.";position:absolute;right:20px;top:20px;font-size:.88rem;color:var(--amber)}
.leit-big{font:800 1.4rem/1.25 var(--display);color:var(--c);margin:12px 0 16px}

/* Entdecken */
.xb{margin:0 0 64px}
.xb-h{margin-bottom:16px;max-width:76ch}
.xb-h h2{font-size:clamp(1.5rem,2.6vw,2rem);letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
.xb-h h2::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c);flex:none}
.xb-h p{color:var(--text2);font-size:1.05rem;margin:0}
.mod-host{background:rgba(3,14,24,.62);border:1px solid var(--edge);border-radius:24px;padding:clamp(12px,2vw,22px)}
.xb.check .item,.xb.act .item{border-left:4px solid var(--c)}
.xb-end{text-align:center;color:var(--text2);margin-top:-20px}

/* ---------- Infokarten ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.fcard{perspective:1400px;display:grid}
.cards .fc-inner{height:100%}
.fc-inner{display:grid;width:100%;min-height:240px;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1);border-radius:20px}
.fcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{grid-area:1/1;display:flex;flex-direction:column;gap:8px;padding:20px;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--edge)}
.fc-front{position:relative;overflow:hidden;background:radial-gradient(circle at 90% 0%,color-mix(in srgb,var(--c) 26%,transparent),transparent 60%),var(--panel2)}
.fc-back{transform:rotateY(180deg);background:#0D2D44;border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.fc-front::after{content:"?";position:absolute;right:14px;bottom:-26px;font:800 9rem/1 var(--display);color:var(--c);opacity:.10;pointer-events:none}
.fc-k{font-size:.8rem;font-weight:700;color:var(--c);margin:0}
.fc-t{font:800 1.25rem/1.15 var(--display)}
.fc-q{font-size:1.02rem;flex:1}
.fc-hint{font-size:.82rem;color:var(--text2);border-top:1px dashed var(--edge2);padding-top:8px}
.fc-a{font-size:.97rem;line-height:1.55} .fc-a p{margin:0 0 .5em} .fc-a ul{margin:.3em 0;padding-left:1.2em}
.fc-back .slide{margin-top:6px}
.fc-inner:hover .fc-front{border-color:var(--c)}
.slide{display:block;background:#F2F6F9;border-radius:14px;padding:10px;color:#221A4A}
.slide svg{width:100%;height:auto;display:block}
.q-fig{margin:12px 0}
.fig-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Modal */
#modal{position:fixed;inset:0;z-index:90;background:rgba(1,8,14,.72);display:grid;place-items:center;padding:20px}
#modal[hidden]{display:none}
.modal-in{position:relative;max-width:660px;width:100%;max-height:86vh;overflow:auto;background:#0D2D44;border:1px solid var(--edge2);border-radius:22px;padding:26px}
.m-close{position:absolute;right:12px;top:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--edge2);background:transparent;color:var(--text);font-size:1.5rem;cursor:pointer}

/* ---------- Quiz ---------- */
.quiz{border-left:4px solid var(--c)}
.q-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--text2);margin-bottom:12px}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid transparent}
.dots i.l2{border-radius:3px} .dots i.l3{border-radius:2px;transform:rotate(45deg) scale(.85)}
.dots .d-ok{background:var(--green)} .dots .d-bad{background:var(--red)} .dots .d-cur{border-color:var(--c);background:transparent}
.lv{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:700;font-size:.8rem}
.lv1{background:rgba(123,227,106,.16);color:var(--green)} .lv2{background:rgba(255,184,77,.16);color:var(--amber)} .lv3{background:rgba(255,90,158,.18);color:var(--pink)}
.q{font:700 1.15rem/1.45 var(--body);margin-bottom:12px}
.hint-line{font-size:.88rem;color:var(--text2)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font:400 1rem/1.45 var(--body);color:var(--text);background:rgba(255,255,255,.04);border:1.5px solid var(--edge2);border-radius:14px;padding:12px 16px;cursor:pointer;transition:border-color .2s,background .2s}
.opts.small .opt{font-size:.95rem;padding:10px 14px}
.opt:hover{border-color:var(--c)}
.opt[aria-checked="true"],.opt[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.opt.ok,.sk.ok{border-color:var(--green);background:rgba(123,227,106,.14)} .opt.bad,.sk.bad{border-color:var(--red);background:rgba(255,107,107,.12)}
.sort{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));column-gap:28px}
.tf-row,.sort-row{padding:12px 0;border-bottom:1px solid var(--edge)} .tf-row p,.sort-row p{margin:0 0 8px}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.seg button{font:700 .92rem var(--body);color:var(--text);background:transparent;border:1.5px solid var(--edge2);border-radius:999px;padding:6px 14px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--c);border-color:var(--c);color:var(--abyss)}
.tf-row.ok,.sort-row.ok{background:linear-gradient(90deg,rgba(123,227,106,.10),transparent)} .tf-row.bad,.sort-row.bad{background:linear-gradient(90deg,rgba(255,107,107,.10),transparent)}
.why{font-size:.92rem;color:var(--text2);margin:6px 0 0!important}
.gaptext{line-height:2.3;font-size:1.05rem}
.gap{font:700 1rem var(--body);color:var(--text);background:rgba(255,255,255,.06);border:0;border-bottom:2px solid var(--c);padding:3px 6px;border-radius:6px 6px 0 0;min-width:6ch}
.gap.ok{border-color:var(--green);background:rgba(123,227,106,.14)} .gap.bad{border-color:var(--red);background:rgba(255,107,107,.14)}
.fix{color:var(--green);font-weight:700;margin:0 4px;font-size:.9rem}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{font:700 .9rem var(--body);background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--edge2);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip.used{opacity:.35}
.rows{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.03)}
.srow.ok{background:rgba(123,227,106,.12)} .srow.bad{background:rgba(255,107,107,.12)}
select,textarea,input.calc,#lnk{font:1rem var(--body);color:var(--text);background:#0B2335;border:1.5px solid var(--edge2);border-radius:12px;padding:9px 12px}
select:focus,textarea:focus,input.calc:focus{border-color:var(--c);outline:none}
.label-wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.label-wrap .srow{grid-template-columns:auto 1fr auto}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--abyss);font:800 .9rem var(--display)}
.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.order li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--edge)}
.order li.ok{border-color:var(--green)} .order li.bad{border-color:var(--red)}
.onum{font:800 1rem var(--display);color:var(--c);min-width:1.4ch} .otext{flex:1}
.obtns{display:flex;gap:4px} .mv{width:34px;height:34px;border-radius:10px;border:1px solid var(--edge2);background:transparent;color:var(--text);cursor:pointer} .mv:disabled{opacity:.25}
.calc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} input.calc{width:150px}
input.calc.ok{border-color:var(--green)} input.calc.bad{border-color:var(--red)}
.unit{color:var(--text2);font-weight:700}
.q-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}
.tipbox{background:rgba(255,184,77,.10);border:1px solid rgba(255,184,77,.4);border-radius:12px;padding:10px 14px;margin:12px 0 0}
.fb{margin-top:12px}
.fb-box{border-radius:14px;padding:14px 16px;border-left:5px solid}
.fb-box.good{background:rgba(123,227,106,.10);border-color:var(--green)} .fb-box.mid{background:rgba(255,184,77,.10);border-color:var(--amber)} .fb-box.low{background:rgba(255,107,107,.10);border-color:var(--red)}
.fb-title{font:800 1.1rem var(--display);margin-bottom:6px}
.fb-note{color:var(--amber);font-weight:700}
.fb-small{font-size:.85rem;color:var(--text2);margin:8px 0 0}
.prac-intro,.exam-intro{margin-bottom:22px}
.lvls{list-style:none;padding:0;margin:10px 0} .lvls li{display:flex;align-items:center;gap:10px;margin:6px 0}
.summary{text-align:center} .summary h2{max-width:34ch;margin:0 auto 12px}
.big-num{font:800 clamp(3.4rem,8vw,5.6rem)/1 var(--display);color:var(--c);letter-spacing:-.04em;margin:0 0 6px}
.lvls.res{display:inline-block;text-align:left}
.tbl{width:100%;border-collapse:collapse;margin:14px 0;text-align:left} .tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--edge)} .tbl th{color:var(--text2);font-size:.88rem}

/* ---------- Klausuraufgaben ---------- */
.task{margin:0 0 26px;border-top:4px solid var(--c)}
.task-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.op-wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.op{font:800 1rem var(--display);color:var(--abyss);background:var(--c);border:0;border-radius:8px;padding:5px 12px;cursor:help}
.op-help{display:block;width:100%;font-size:.9rem;color:var(--text2);background:rgba(255,255,255,.04);border-radius:10px;padding:8px 12px}
.op-help[hidden]{display:none}
.afb{display:inline-block;font-weight:700;font-size:.8rem;color:var(--text2);border:1px solid var(--edge2);border-radius:6px;padding:3px 8px}
.afb-l{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--text2);margin:0}
.pts{font:800 1rem var(--display);color:var(--c)}
.task-q{font-size:1.1rem;font-weight:700;line-height:1.5;max-width:80ch}
.hilfen{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.h-l{font-weight:700;color:var(--text2);font-size:.88rem}
.hbtn{font:700 .88rem var(--body);color:var(--amber);background:rgba(255,184,77,.08);border:1.5px solid rgba(255,184,77,.5);border-radius:999px;padding:6px 14px;cursor:pointer}
.hbtn:disabled{opacity:.35;cursor:default} .hbtn.used{opacity:.6;background:transparent}
.hbox{width:100%} .hstep{background:rgba(255,184,77,.08);border-left:3px solid var(--amber);border-radius:8px;padding:8px 12px;margin:8px 0 0;font-size:.97rem}
textarea{width:100%;line-height:1.55;resize:vertical;min-height:150px}
.task-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.task-bar .row{margin:0}
.wc{font-size:.85rem;color:var(--text2)}
.task-fb{margin-top:12px}
.crit{list-style:none;padding:0;margin:8px 0} .crit li{margin:4px 0} .c-ok{color:var(--text)} .c-ok span{color:var(--green);font-weight:800} .c-miss{color:var(--text2)} .c-miss span{color:var(--amber)}
.sol{margin-top:14px;padding:16px;border-radius:14px;background:rgba(70,240,210,.06);border:1px dashed color-mix(in srgb,var(--c) 60%,transparent)}
.sol ul{padding-left:1.2em}
.from{font-weight:700;color:var(--c);margin:26px 0 8px}

/* Sicherung */
.back-to{border-left:5px solid var(--c);margin-bottom:22px}
.merke{border:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel));margin:20px 0}
.merke p{font-size:1.1rem;margin:0}
.ichkann{margin:26px 0} .ichkann ul{list-style:none;padding:0;margin:0}
.ichkann li{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--edge)}
.ampel{display:flex;gap:8px;flex:none}
.ampel button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;opacity:.35}
.am-g{background:var(--green)} .am-y{background:var(--amber)} .am-r{background:var(--red)}
.ampel button[aria-checked="true"]{opacity:1;border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.4)}
.station-end{text-align:center}

/* ---------- Karteikasten, Simulator, Seiten ---------- */
.plain{max-width:1000px;margin:0 auto;padding:44px clamp(16px,4vw,40px)} .plain.wide{max-width:1240px}
.kk-h{display:flex;align-items:center;gap:12px;margin:34px 0 14px;font-size:1.5rem}
.kk-h span{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--c);color:var(--abyss);font-size:1rem}
.kk-f .chip-btn[aria-pressed="true"]{background:var(--c,var(--cyan));border-color:var(--c,var(--cyan))}
.drill{max-width:440px;margin:30px auto;text-align:center} .drill .fcard{text-align:left}
.pt-list{list-style:none;padding:0;margin:8px 0 12px;display:flex;flex-direction:column;gap:6px}
.pt-list span,.from span{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:8px;border-radius:50%;background:var(--c);color:var(--abyss);font:800 .8rem var(--display)}
.probe-opts{margin:16px 0;display:flex;flex-direction:column;gap:8px} .probe-opts legend{font:700 1rem var(--display);padding:0 6px}
.probe-opts label{display:flex;gap:10px;align-items:center}
.probe-bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.clock{font:800 1.8rem var(--display);color:var(--amber);font-variant-numeric:tabular-nums} .clock.over{color:var(--red)}
.pane-end{text-align:center;margin:20px 0}
.ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin:0} .ops dt{font:800 1.15rem var(--display);color:var(--cyan)} .ops dd{margin:4px 0 0}
.tips li{margin:6px 0}
#lnk{flex:1;min-width:260px}

/* Toasts & Funken */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#0D2D44;border:1px solid var(--cyan);color:var(--text);padding:9px 18px;border-radius:999px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .3s ease-out;transition:opacity .4s,transform .4s;max-width:90vw;text-align:center}
.toast.big{background:var(--cyan);color:var(--abyss);font-size:1.1rem;padding:14px 24px}
.toast.out{opacity:0;transform:translateY(10px)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}
.burst{position:fixed;left:50%;top:45%;z-index:99;pointer-events:none}
.burst i{position:absolute;width:9px;height:9px;border-radius:50%;animation:bst 1.2s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes bst{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}

/* ---------- Szenen (allgemein) ---------- */
.scene-svg{width:100%;height:auto;display:block;overflow:visible}
.sc-l{font:400 14px var(--body);fill:var(--text2)} .sc-title{font:800 19px var(--display);fill:var(--text)} .sc-note{font:italic 13px var(--body);fill:var(--text2)}
.stage-cap{font:700 16px var(--body);fill:var(--text)} .aa-t{font:700 12px var(--body);fill:#062031} .o-t{font:700 12px var(--body);fill:var(--text2)} .ion-t{font:800 10px var(--body);fill:#062031}
.ax{font:13px var(--body);fill:var(--text2)} .mic-l{font:700 13px var(--body);fill:#fff;paint-order:stroke;stroke:rgba(20,18,30,.75);stroke-width:4px}
.fl-t{font:700 14px var(--body);fill:var(--text);paint-order:stroke;stroke:rgba(3,17,28,.75);stroke-width:4px}
.big-x{font:800 34px var(--display);fill:var(--amber)}
.lab-status{font-weight:700;color:var(--c);min-height:1.4em;margin:6px 0 0}
.lab-cv{width:100%;height:auto;display:block;aspect-ratio:800/420;border-radius:16px;background:rgba(1,8,14,.5)}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes pulse{50%{transform:scale(1.14)}}
@keyframes popin{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Stepper */
.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.sp-dots{display:flex;gap:6px;flex:1;justify-content:center}
.sp-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--edge2);background:transparent;cursor:pointer;padding:0}
.sp-dot.on{background:var(--c);border-color:var(--c)}
.sp-text{margin-top:12px;padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.04);border-left:4px solid var(--c);min-height:4.2em;font-size:1.05rem}
.sp-n{display:inline-block;font:800 .82rem var(--display);color:var(--abyss);background:var(--c);border-radius:6px;padding:2px 7px;margin-right:6px}

/* 3D */
.m3-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.m3d{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(70,240,210,.08),rgba(1,8,14,.6) 70%)}
.m3d canvas{display:block;width:100%;cursor:grab;touch-action:none} .m3d canvas:active{cursor:grabbing}
.m3d-tip{position:absolute;pointer-events:none;background:rgba(3,17,28,.92);border:1px solid var(--c);color:var(--text);font-weight:700;font-size:.88rem;padding:5px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-130%)}
.m3d-hint{position:absolute;left:14px;bottom:12px;font-size:.82rem;font-weight:700;color:var(--text);background:rgba(3,17,28,.7);border:1px solid var(--edge2);padding:5px 12px;border-radius:999px;transition:opacity .6s;pointer-events:none}
.m3d-hint::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px;animation:pulse 1.4s infinite}
.m3d-hint.gone{opacity:0}
.m3-side{position:sticky;top:80px}
.m3-side .ctrl-row{margin:6px 0 10px}
.m3-info{margin-top:10px;border-top:1px solid var(--edge);padding-top:12px;min-height:120px}
.m3-info h4{color:var(--c);font-size:1.2rem}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.hunt{margin:4px 0} .hunt-q{font-weight:700;margin:6px 0} .hunt-msg{color:var(--amber);font-size:.9rem;margin:0} .hunt-ok{color:var(--green);font-weight:800}

/* Mikroskop */
.mic{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:22px;align-items:center}
.mic-view{position:relative;border-radius:50%;box-shadow:0 0 0 10px #0B1724,0 0 0 12px var(--edge2),0 20px 60px rgba(0,0,0,.5)}
.mic-svg{width:100%;height:auto;display:block}
.mic-scale{position:absolute;right:16%;bottom:13%;display:flex;flex-direction:column;align-items:center;gap:2px;font:800 .82rem var(--body);color:#fff;text-shadow:0 1px 3px #000}
.mic-scale i{display:block;width:56px;height:5px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.6)}
.mic-note{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);border-left:4px solid var(--c);min-height:4em}

/* Pro/Euk */
.pk{cursor:pointer;transition:opacity .35s} .pk:focus{outline:none} .pk:focus-visible > *{stroke:var(--amber)}
.pk.sel{filter:drop-shadow(0 0 8px #fff)}
.prokeuk[data-v="both"] .pk:not([data-c="both"]){opacity:.12} .prokeuk[data-v="diff"] .pk[data-c="both"]{opacity:.12}
.pk-info{padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);min-height:3.2em}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:999px;margin-right:4px}
.t-both{background:rgba(70,240,210,.18);color:var(--cyan)} .t-pro{background:rgba(123,227,106,.18);color:var(--green)} .t-eu{background:rgba(168,148,255,.2);color:var(--lilac)}

/* Insulin, Endosymbiose */
.ins-tok{transition:transform 1s cubic-bezier(.5,0,.3,1)}
.ins-part{opacity:.55;transition:opacity .4s,filter .4s} .ins-part.on{opacity:1;filter:drop-shadow(0 0 10px rgba(70,240,210,.7))}
.ef{opacity:0;transition:opacity .6s} .ef.on{opacity:1}

/* Proteine */
.protein .pl{opacity:0;transition:opacity .6s;pointer-events:none}
.protein.lvl-1 .pl-1,.protein.lvl-2 .pl-2,.protein.lvl-3 .pl-3,.protein.lvl-4 .pl-4,.protein.lvl-d .pl-d{opacity:1}
.protein .heat{opacity:0;transition:opacity .4s} .protein.heating .heat{opacity:1}
.heatwave{animation:heat 1.2s ease-in-out infinite}
@keyframes heat{0%{transform:translateY(0);opacity:.3}50%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.protein.heating .pl{animation:jitter .15s linear infinite}
@keyframes jitter{25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}
.spin-slow{animation:spin 40s linear infinite}
.lvl-name{font-weight:800;min-width:13ch;color:var(--c)}

/* Dauerwelle, Zucker, Fette */
.pw{opacity:0;transition:opacity .6s} .pw.on{opacity:1}
.kchain{fill:none;stroke:#C99A6B;stroke-width:9;stroke-linecap:round}
.ss.broken line{stroke-dasharray:3 9;opacity:.6} .ss.broken circle{fill:#9FC1C7}
.ss.new line{stroke:var(--green)} .ss.new circle{fill:var(--green)}

@keyframes pass{0%{transform:translateY(0)}80%,100%{transform:translateY(230px)}}

@keyframes driftx{50%{transform:translateX(26px)}}

.signal .adr,.signal .ins,.signal .glc,.signal .gprot,.signal .enz,.signal .rec path{transition:transform 1s cubic-bezier(.5,0,.3,1),opacity .6s,fill .6s}
.signal .adr{transform:translate(140px,55px)}

.signal .gprot{opacity:.25} .signal.st2 .gprot,.signal.st3 .gprot,.signal.st4 .gprot,.signal.st5 .gprot{opacity:1;transform:translateX(-24px)}

.signal.st2 .rec path,.signal.st3 .rec path,.signal.st4 .rec path,.signal.st5 .rec path{fill:#C9B6FF}

.medium.burst .ery-body,.medium.burst .ery-cren{opacity:0} .medium.burst .ery-burst{opacity:1}
.arrows-in,.arrows-out{opacity:0;transition:opacity .4s} .medium.in .arrows-in,.medium.out .arrows-out{opacity:var(--arr)}

.exp{display:flex;flex-direction:column;gap:14px}

.sk-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}

/* Ozean, Stoma, Krabbe */
.ocean .water-bg{transition:fill .8s} .ocean.sea .water-bg{fill:url(#seaG)} .ocean.fresh .water-bg{fill:url(#freshG)}
.salt-p{fill:var(--amber);opacity:.7;animation:cyto 10s ease-in-out infinite;transition:opacity .8s}
@keyframes cyto{33%{transform:translate(14px,-10px)}66%{transform:translate(-10px,12px)}}
.ocean.fresh .salt-p.many{opacity:0}
.f-sea,.f-fresh{transition:opacity .6s} .ocean.sea .f-fresh,.ocean.fresh .f-sea{opacity:0}
.weeds{opacity:0;transition:opacity .8s} .ocean.fresh .weeds{opacity:1}
.gull{transition:opacity .6s} .ocean.fresh .gull{opacity:0}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite} @keyframes sway{50%{transform:rotate(5deg)}}
.flow{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:14 10;animation:flow 1.1s linear infinite} .flow.thin{stroke-width:3} .flow.thick{stroke-width:10}
.swim{animation:swim 4s ease-in-out infinite} @keyframes swim{50%{transform:translate(-6px,-8px)}}
.drip{animation:drip 2s ease-in infinite} @keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(40px);opacity:0}}
.stoma .nz{fill:rgba(247,227,182,.12);stroke:rgba(214,178,106,.7);stroke-width:2}
.stoma .gc{fill:#5BB383;stroke:#BDF5D4;stroke-width:3}
.g-open,.g-closed{transition:opacity .8s .5s}
.stoma .g-open{opacity:0} .stoma.st-open .g-open{opacity:1} .stoma.st-open .g-closed{opacity:0}
.ion{fill:var(--pink);stroke:#fff;stroke-width:1.5;transition:transform 1.2s cubic-bezier(.5,0,.3,1)}
.stoma.st-open .ion{transform:translate(var(--dx),var(--dy))}
.w-in{opacity:0;transition:opacity .5s} .stoma.st-open .w-in{opacity:1;transition-delay:1.1s}
.w-in path{stroke-dasharray:10 8;animation:flow 1s linear infinite}
.stoma .atp{transform-box:fill-box;transform-origin:center} .stoma.pumping .atp{animation:pulse .5s ease-in-out 2}
.crab-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}

.crab .grid{stroke:rgba(255,255,255,.08)} .crab .axis{stroke:var(--text2);stroke-width:2}

.crab .mark{stroke:var(--text2);stroke-dasharray:4 4}

/* Probeklausur */
.pk-list{margin-top:44px}

.pk{--c:var(--amber)} .pk-exam{--c:var(--amber);max-width:1400px;margin:0 auto;padding:26px clamp(16px,3vw,34px) 40px}
.pk-setup{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start;margin:20px 0}

.pk-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px} .pk-bar h1{font:800 clamp(1.8rem,3.6vw,2.6rem)/1.05 var(--display);margin:4px 0 0}

.pk-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:start}
.pk-mat{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;padding-right:4px}
.pk-tabs{display:flex;gap:6px;margin-bottom:10px}
.pk-m h3{color:var(--amber)} .pk-m p{font-size:1rem}
.pk-nr{font:800 1.1rem var(--display);color:var(--amber);margin:22px 0 8px} .pk-nr:first-child{margin-top:0}
.op-x{font:700 .9rem var(--display);color:var(--amber);border:1.5px solid var(--amber);border-radius:8px;padding:3px 10px;cursor:help}
.pk-exam.ernst .chkbtn{display:none}

/* ---------- Responsiv ---------- */
@media (max-width: 980px){
  .plan-grid{grid-template-columns:1fr} .plan-side{position:static}

<script>
/* ===== Abbildungen (eigene SVG-Zeichnungen) ===== */
const C = {
  ink:'#221A4A', hema:'#4B3C9E', hemaSoft:'#DCD4F5', eosin:'#D9467A', eosinSoft:'#FADDE8',
  chloro:'#2F8F5B', chloroSoft:'#D6ECDD', amber:'#E39B2C', water:'#3D7CC9', waterSoft:'#D8E8F8',
  grey:'#8B86A3', mito:'#F2AE72', mitoDark:'#B4602A', lyso:'#F2C64E'
};

function mk(n,x,y){
  return `<g class="mk"><circle cx="${x}" cy="${y}" r="14" fill="${C.ink}" stroke="#fff" stroke-width="3"/>`+
         `<text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="Atkinson Hyperlegible, sans-serif">${n}</text></g>`;
}
function lab(px,py,lx,ly,t,anchor){
  anchor = anchor || (lx<px?'end':'start');
  const dx = anchor==='end'?-4:4;
  return `<g class="lab"><line x1="${px}" y1="${py}" x2="${lx}" y2="${ly}" stroke="${C.ink}" stroke-width="1.2"/>`+
         `<circle cx="${px}" cy="${py}" r="2.6" fill="${C.ink}"/>`+
         `<text x="${lx+dx}" y="${ly+4}" text-anchor="${anchor}" font-size="13" fill="${C.ink}">${t}</text></g>`;
}
function svgWrap(vb, inner, title){
  return `<svg viewBox="${vb}" role="img" aria-label="${title||'Abbildung'}" xmlns="http://www.w3.org/2000/svg" font-family="Atkinson Hyperlegible, sans-serif">${title?`<title>${title}</title>`:''}${inner}</svg>`;
}
/* Teile-Overlay: mode 'labels' oder Marker-Liste */
function overlay(parts, opts){
  opts = opts||{};
  if(opts.markers){ return opts.markers.map((id,i)=>{const p=parts[id]; if(p.m){ return `<line x1="${p.x}" y1="${p.y}" x2="${p.m[0]}" y2="${p.m[1]}" stroke="${C.ink}" stroke-width="2"/><circle cx="${p.x}" cy="${p.y}" r="3" fill="${C.ink}"/>`+mk(i+1,p.m[0],p.m[1]); } return mk(i+1,p.x,p.y);}).join(''); }
  if(opts.labels===false) return '';
  return Object.values(parts).map(p=>lab(p.x,p.y,p.lx,p.ly,p.t,p.a)).join('');
}
function mito(x,y,rot,s){
  s=s||1;
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><ellipse rx="36" ry="17" fill="${C.mito}" stroke="${C.mitoDark}" stroke-width="2.5"/>`+
  `<path d="M-26 0 L-20 -10 L-14 8 L-8 -10 L-2 8 L4 -10 L10 8 L16 -10 L22 6" fill="none" stroke="${C.mitoDark}" stroke-width="2" stroke-linejoin="round"/></g>`;
}
function chloro(x,y,rot){
  let st='';
  for(let i=-2;i<=2;i++){ st+=`<rect x="${i*13-4}" y="-8" width="8" height="16" rx="2" fill="#2E7A4C"/>`; }
  return `<g transform="translate(${x} ${y}) rotate(${rot})"><ellipse rx="40" ry="20" fill="#86C79A" stroke="${C.chloro}" stroke-width="2.5"/>`+
  `<line x1="-30" y1="0" x2="30" y2="0" stroke="#2E7A4C" stroke-width="1.5"/>${st}</g>`;
}
function golgi(x,y,s){
  s=s||1; let g='';
  for(let i=0;i<4;i++){ const w=34-i*3; g+=`<path d="M${-w} ${i*9} Q0 ${i*9-14} ${w} ${i*9}" fill="none" stroke="#7A5BC7" stroke-width="6" stroke-linecap="round"/>`; }
  g+=`<circle cx="42" cy="14" r="5" fill="#B7A3EE" stroke="#7A5BC7" stroke-width="1.5"/><circle cx="38" cy="-6" r="4" fill="#B7A3EE" stroke="#7A5BC7" stroke-width="1.5"/>`;
  return `<g transform="translate(${x} ${y}) scale(${s})">${g}</g>`;
}
function arcPath(cx,cy,r,a0,a1){
  const p=a=>[cx+r*Math.cos(a*Math.PI/180), cy+r*Math.sin(a*Math.PI/180)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1);

function roughER(cx,cy,radii,a0,a1){

    o+=`<path d="${arcPath(cx,cy,r,a0,a1)}" fill="none" stroke="#E07BA0" stroke-width="5" stroke-linecap="round"/>`;
    for(let a=a0+4;a<a1;a+=11){ const x=cx+(r+5)*Math.cos(a*Math.PI/180), y=cy+(r+5)*Math.sin(a*Math.PI/180); o+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.3" fill="${C.ink}"/>`; }
  });
  return o;
}

function lipid(x,y,up,col){

function bilayer(x0,x1,yTop,yBot,skip,step){

  er:{t:'Endoplasmatisches Reticulum', q:'Was ist das „raue“ am rauen ER?', a:'<p>Das <strong>ER</strong> ist ein Membransystem, das von der Kernhülle ausgeht. Das <strong>raue ER</strong> ist mit Ribosomen besetzt (Proteinsynthese und -transport), das <strong>glatte ER</strong> ohne Ribosomen bildet z. B. Lipide und entgiftet. Vom ER schnüren sich Vesikel ab.</p>'},
  golgi:{t:'Golgi-Apparat / Dictyosom', q:'Was passiert mit Proteinen nach dem ER?', a:'<p>Im <strong>Golgi-Apparat</strong> (Stapel aus Dictyosomen) werden Proteine verändert (z. B. mit Zuckerketten versehen), sortiert und in <strong>Transportvesikel</strong> verpackt – Ziel: Lysosom, Zellmembran oder Export.</p>'},
  mito:{t:'Mitochondrium', q:'Warum hat ein Herzmuskel so viele Mitochondrien?', a:'<p>In Mitochondrien läuft die <strong>Zellatmung</strong> ab: Energie aus Nährstoffen wird in <strong>ATP</strong> umgewandelt. Die gefaltete Innenmembran (Cristae) vergrößert die Oberfläche. Zellen mit hohem Energiebedarf – Herzmuskel, Spermien – haben besonders viele.</p>'},
  lyso:{t:'Lysosom', q:'Wie recycelt eine Zelle?', a:'<p><strong>Lysosomen</strong> sind Bläschen mit <strong>Verdauungsenzymen</strong>. Sie bauen alte Zellbestandteile und aufgenommene Partikel ab; die Bausteine werden wiederverwendet. Die Enzyme arbeiten bei pH ≈ 5 – im neutralen Cytoplasma sind sie kaum aktiv.</p>'},
  perox:{t:'Peroxisom', q:'Wer entgiftet mit Sauerstoff?', a:'<p><strong>Peroxisomen</strong> bauen Stoffe durch Oxidation mit Sauerstoff ab, z. B. Fettsäuren und Giftstoffe (in Leberzellen auch Alkohol). Das dabei entstehende Wasserstoffperoxid wird sofort zerlegt.</p>'},
  skelett:{t:'Cytoskelett & Centrosom', q:'Was gibt der Zelle Form und bewegt Vesikel?', a:'<p>Das <strong>Cytoskelett</strong> ist ein Netz aus Proteinfäden: Es gibt Form, ermöglicht Bewegung und dient als „Schiene“ für Vesikel. Das <strong>Centrosom</strong> (Tierzelle) organisiert die Mitosespindel bei der Zellteilung.</p>'},
  wand:{t:'Zellwand (Pflanze)', q:'Warum platzt eine Pflanzenzelle nicht?', a:'<p>Die <strong>Zellwand</strong> aus Cellulose ist fest und dehnbar. Sie hält dem Innendruck (<strong>Turgor</strong>) stand und gibt der Pflanzenzelle ihre Form. <strong>Plasmodesmen</strong> verbinden Nachbarzellen durch die Wand.</p>'},
  vakuole:{t:'Zentralvakuole', q:'Was steckt im großen „Wassersack“ der Pflanzenzelle?', a:'<p>Die <strong>Vakuole</strong> enthält Zellsaft (Wasser, Salze, Zucker, Farbstoffe wie das Rot der Zwiebel). Ihre Membran heißt <strong>Tonoplast</strong>. Durch Wasseraufnahme erzeugt sie den Turgor.</p>'},
  chloro:{t:'Chloroplast', q:'Wo wird Lichtenergie in Zucker verwandelt?', a:'<p>In <strong>Chloroplasten</strong> findet die <strong>Fotosynthese</strong> statt: Aus CO₂ und Wasser entstehen mithilfe von Lichtenergie Glucose und Sauerstoff. Sie sind von einer Doppelmembran umgeben und enthalten eigene DNA.</p>'},
  endosym:{t:'Endosymbiontentheorie', q:'Waren Mitochondrien einmal Bakterien?', a:'<p>Nach der <strong>Endosymbiontentheorie</strong> stammen Mitochondrien von aeroben Bakterien und Chloroplasten von Cyanobakterien ab, die vor über einer Milliarde Jahren von einer Urzelle aufgenommen und nicht verdaut wurden. <strong>Belege:</strong> Doppelmembran, eigene ringförmige DNA, 70S-Ribosomen, Vermehrung durch Teilung, bakterienähnliche Größe.</p>'},
  differenz:{t:'Zelldifferenzierung', q:'Warum sehen Muskel- und Drüsenzellen innen so verschieden aus?', a:'<p>Bei Vielzellern <strong>spezialisieren</strong> sich Zellen auf Aufgaben (<strong>Arbeitsteilung</strong>). Ihre Ausstattung passt zur Funktion: Herzmuskelzellen haben sehr viele Mitochondrien, Insulin-produzierende Zellen viel raues ER und Golgi-Apparat, Palisadenzellen viele Chloroplasten. Struktur und Funktion hängen zusammen.</p>'}
});

  klausur:[
    {op:'Erklären', afb:'II', p:5, q:'Erklären Sie, wie verschiedene Zellbestandteile zusammenwirken, wenn eine Zelle der Bauchspeicheldrüse Insulin herstellt und ins Blut abgibt.',
     crit:[
      {t:'Ribosomen (am rauen ER): Proteinsynthese', p:1, all:[['ribosom']]},
      {t:'ER: Transport/Weiterleitung', p:1, all:[[' er ','endoplasm','reticulum']]},
      {t:'Vesikel als Transportmittel', p:1, all:[['vesikel','blaeschen']]},
      {t:'Golgi-Apparat / Dictyosom: verändern, verpacken', p:1, all:[['golgi','dictyosom']]},
      {t:'Abgabe durch Verschmelzen mit der Zellmembran (Exocytose)', p:1, all:[['membran'],['exocytose','verschmilzt','verschmelz','abgegeben','abgabe','nach aussen','freigesetzt']]}],
     hilfen:['Verfolge den Weg eines Insulin-Moleküls: Wo entsteht es, wie reist es, wie verlässt es die Zelle?','Stationen: Zellkern (Bauanleitung) → Ribosom am rauen ER → ER → Vesikel → Golgi → Vesikel → Zellmembran. Energie: Mitochondrien.','Satzanfänge: „Zunächst wird …“ – „Anschließend schnüren sich …“ – „Im Golgi-Apparat …“ – „Schließlich verschmilzt …“'],
     model:'Der Zellkern liefert die Bauanleitung für Insulin. An den Ribosomen des rauen ER wird das Protein synthetisiert und gelangt ins ER, wo es weitergeleitet wird. Vom ER schnüren sich Transportvesikel ab und bringen das Insulin zum Golgi-Apparat. Dort wird es verändert, sortiert und in sekretorische Vesikel verpackt. Diese wandern – entlang des Cytoskeletts – zur Zellmembran, verschmelzen mit ihr und geben das Insulin nach außen ins Blut ab (Exocytose). Die Energie (ATP) liefern die Mitochondrien.'},
    {op:'Vergleichen', afb:'II', p:6, q:'Vergleichen Sie die Struktur von Tier- und Pflanzenzelle.', fig:'plantCell',
     crit:[
      {t:'gemeinsame Bestandteile (mind. 3)', p:2, some:['zellkern','mitochondri','ribosom','endoplasm',' er ','golgi','dictyosom','zellmembran','cytoplasma','lysosom','peroxisom','cytoskelett'], min:3},
      {t:'Gemeinsamkeiten und Unterschiede erkennbar gegenübergestellt', p:1, all:[['beide','gemeinsam','sowohl'],['nur','dagegen','hingegen','im gegensatz','unterschied','waehrend']]},
      {t:'Zellwand nur bei Pflanzenzellen', p:1, all:[['zellwand','zellwae']]},
      {t:'Chloroplasten nur bei Pflanzenzellen', p:1, all:[['chloroplast']]},
      {t:'Zentralvakuole (Pflanze) bzw. Centrosom (Tier)', p:1, some:['vakuole','centrosom','zentrosom'], min:1}],
     hilfen:['Erst Gemeinsamkeiten, dann Unterschiede – immer an Kriterien entlang (z. B. Organellen, Begrenzung, Energiegewinnung).','Pflanzenzelle zusätzlich: Zellwand, Chloroplasten, große Vakuole, Plasmodesmen. Tierzelle zusätzlich: Centrosom.','Satzanfänge: „Beide Zellen besitzen …“ – „Nur die Pflanzenzelle …“ – „Die Tierzelle hingegen …“'],
     model:'Tier- und Pflanzenzelle sind Eukaryotenzellen. Gemeinsam haben sie Zellkern, Ribosomen, ER, Golgi-Apparat, Mitochondrien, Lysosomen, Peroxisomen, Cytoskelett, Cytoplasma und Zellmembran. Nur die Pflanzenzelle besitzt eine Zellwand aus Cellulose, Chloroplasten für die Fotosynthese und eine große Zentralvakuole, deren Druck gegen die Wand die Zelle stabilisiert; sie ist über Plasmodesmen mit Nachbarzellen verbunden. Die Tierzelle besitzt dagegen ein Centrosom, das die Mitosespindel bildet.'},
    {op:'Erläutern', afb:'II', p:6, q:'Erläutern Sie die Endosymbiontentheorie und nennen Sie drei Befunde, die sie stützen.',
     crit:[
      {t:'Urzelle nimmt Bakterium auf (Endocytose), verdaut es nicht', p:1, some:['aufgenommen','aufnahme','endocytose','phagocytose','eingeschlossen','nicht verdaut'], min:1},
      {t:'Mitochondrien aus aeroben Bakterien, Chloroplasten aus Cyanobakterien', p:1, some:['cyanobakteri','aerobe','bakterien'], min:1},
      {t:'Zusammenleben zum gegenseitigen Vorteil (Symbiose)', p:1, some:['symbiose','vorteil','gegenseitig','zusammenleben'], min:1},
      {t:'Belege (mind. 3): Doppelmembran, eigene DNA, 70S-Ribosomen, Teilung, Größe', p:3, some:['doppelmembran','eigene dna','ringfoermig','70s','teilung','teilen sich','groesse'], min:3}],
     hilfen:['„Endo“ = innen, „Symbiose“ = Zusammenleben zum gegenseitigen Nutzen. Wer lebt in wem?','Belege zielen auf Ähnlichkeit mit Bakterien: Membran, Erbinformation, Ribosomen, Vermehrung, Größe.','Satzanfänge: „Nach der Endosymbiontentheorie …“ – „Für die Theorie spricht, dass Mitochondrien …“'],
     model:'Nach der Endosymbiontentheorie nahm eine eukaryotische Urzelle vor über einer Milliarde Jahren aerobe Bakterien durch Endocytose auf, verdaute sie aber nicht. Die Bakterien lebten im Inneren weiter – zum gegenseitigen Vorteil: Sie erhielten Schutz und Nährstoffe und lieferten Energie. Aus ihnen wurden die Mitochondrien; Chloroplasten entstanden ebenso aus aufgenommenen Cyanobakterien. Belege: Mitochondrien und Chloroplasten besitzen eine Doppelmembran (die innere ähnelt Bakterienmembranen, die äußere stammt vom Aufnahmevesikel), eigene ringförmige DNA, 70S-Ribosomen wie Bakterien, sie vermehren sich durch Teilung und haben etwa Bakteriengröße.'},
    {op:'Deuten', afb:'III', p:4, q:'Material: In Herzmuskelzellen nehmen Mitochondrien etwa 35 % des Zellvolumens ein, in Leberzellen etwa 20 %. Zellen der Bauchspeicheldrüse, die Verdauungsenzyme und Insulin bilden, sind dicht mit rauem ER gefüllt. Deuten Sie diese Befunde.',
     crit:[
      {t:'Prinzip: Struktur passt zur Funktion / Spezialisierung', p:1, some:['struktur','funktion','spezialis','differenz','arbeitsteilung','angepasst'], min:1},
      {t:'Herzmuskel: hoher Energiebedarf → viele Mitochondrien/ATP', p:1, all:[['herz','muskel'],['energie','atp']]},
      {t:'Bauchspeicheldrüse: viele Proteine/Export → raues ER', p:1, all:[['protein','enzym','insulin'],['raue','rauen','rer','ribosom']]},
      {t:'Vergleich/Begründung der Mengenunterschiede', p:1, some:['mehr','weniger','geringer','hoeher','dauerhaft','staendig','ununterbrochen'], min:1}],
     hilfen:['Frage dich bei jeder Zelle: Was ist ihre Hauptaufgabe – und welches Organell erledigt genau das?','Basiskonzept Struktur und Funktion: Viel Aufgabe → viel passendes Organell.','Satzanfänge: „Die Befunde zeigen, dass …“ – „Da Herzmuskelzellen …, …“ – „Die Zellen der Bauchspeicheldrüse …“'],
     model:'Die Befunde zeigen, dass die Ausstattung einer Zelle zu ihrer Funktion passt (Zelldifferenzierung, Struktur-Funktions-Zusammenhang). Herzmuskelzellen arbeiten ununterbrochen und haben einen sehr hohen Energiebedarf; der hohe Mitochondrienanteil liefert entsprechend viel ATP. Leberzellen benötigen weniger Energie für Bewegung, daher ist ihr Anteil geringer. Die Zellen der Bauchspeicheldrüse produzieren große Mengen an Proteinen für den Export (Verdauungsenzyme, Insulin); das ausgedehnte raue ER mit seinen Ribosomen ermöglicht diese hohe Proteinsynthese.'},
    {op:'Erläutern', afb:'II', p:3, q:'Erläutern Sie die Bedeutung der Kompartimentierung am Beispiel des Lysosoms.',
     crit:[
      {t:'Kompartimente = durch Membranen getrennte Reaktionsräume', p:1, all:[['membran','abgegrenzt','getrennt'],['raum','raeum','kompartiment']]},
      {t:'Lysosom: Verdauungsenzyme eingeschlossen, Schutz der Zelle', p:1, all:[['lysosom'],['enzym','verdau']]},
      {t:'unterschiedliche Bedingungen (pH) / gleichzeitige Reaktionen', p:1, some:['ph','sauer','gleichzeitig','bedingungen','optimal'], min:1}],
     hilfen:['Was würde passieren, wenn die Verdauungsenzyme frei im Cytoplasma schwimmen?','Stichworte: Membran trennt – eigene Bedingungen (pH 5) – Schutz – gleichzeitige Reaktionen.','Satzanfänge: „Kompartimentierung bedeutet …“ – „Im Lysosom …“ – „Dadurch …“'],
     model:'Kompartimentierung bedeutet, dass die Zelle durch Membranen in getrennte Reaktionsräume gegliedert ist. Im Lysosom sind Verdauungsenzyme eingeschlossen; sie können dort Zellbestandteile abbauen, ohne die übrige Zelle anzugreifen. Zudem herrschen im Lysosom eigene Bedingungen (pH ≈ 5), bei denen die Enzyme optimal arbeiten, während sie im neutralen Cytoplasma kaum aktiv wären. So können in einer Zelle gleichzeitig Aufbau- und Abbauprozesse ablaufen.'}
  ],
  sicherung:{ q:'Beantworte jetzt die Leitfrage: Wie arbeiten die Bestandteile einer Zelle zusammen – und warum sehen Herz- und Drüsenzellen innen verschieden aus?',
    crit:[

      {t:'Drüsenzelle: viel raues ER/Golgi für Proteine', p:1, all:[['druese','bauchspeichel','insulin'],['raue','er ','golgi','protein']]}],
    model:'Organellen übernehmen verschiedene Aufgaben und arbeiten zusammen: Der Zellkern liefert die Bauanleitung, Ribosomen am rauen ER bilden Proteine, ER und Vesikel transportieren sie, der Golgi-Apparat verpackt sie, Mitochondrien liefern die Energie. Spezialisierte Zellen sind passend ausgestattet: Herzmuskelzellen besitzen sehr viele Mitochondrien für ihren hohen Energiebedarf, Insulin-bildende Drüsenzellen viel raues ER und Golgi-Apparat für die Proteinproduktion.',
    merke:'Die Eukaryotenzelle ist <strong>kompartimentiert</strong>: Organellen sind spezialisierte Reaktionsräume, die <strong>arbeitsteilig</strong> zusammenwirken. Spezialisierte Zellen zeigen: <strong>Struktur passt zur Funktion</strong>. Mitochondrien und Chloroplasten stammen vermutlich von Bakterien ab (<strong>Endosymbiontentheorie</strong>).',
    ichkann:['Ich kann Organellen im Schema erkennen und ihre Funktion nennen.','Ich kann den Weg eines Exportproteins durch die Zelle erklären.','Ich kann die Endosymbiontentheorie mit Belegen erläutern.','Ich kann Zellausstattung und Zellfunktion verknüpfen.'] }

Object.assign(CARDS, {
  aminos:{t:'Aminosäuren & Peptidbindung', q:'Woraus besteht ein Protein?', a:'<p>Proteine sind Ketten aus <strong>Aminosäuren</strong>. Jede Aminosäure besitzt eine <strong>Aminogruppe (–NH₂)</strong>, eine <strong>Carboxylgruppe (–COOH)</strong> und einen <strong>Rest R</strong>. Unter <strong>Wasserabspaltung</strong> verknüpfen sie sich über <strong>Peptidbindungen</strong> zu einer Polypeptidkette.</p>', fig:'aminoacid'},
  struktur:{t:'Vier Strukturebenen', q:'Wie wird aus einer Kette ein funktionsfähiges Protein?', a:'<p><strong>Primärstruktur:</strong> Reihenfolge der Aminosäuren. <strong>Sekundärstruktur:</strong> α-Helix und β-Faltblatt, gehalten durch Wasserstoffbrücken. <strong>Tertiärstruktur:</strong> räumliche Faltung der ganzen Kette, u. a. durch Disulfidbrücken – erst jetzt ist das Protein aktiv. <strong>Quartärstruktur:</strong> mehrere Ketten lagern sich zusammen.</p>', fig:'proteinLevels'},
  denat:{t:'Denaturierung', q:'Was passiert mit Eiweiß in der heißen Pfanne?', a:'<p>Hitze, Säuren oder Schwermetall-Ionen lösen die Bindungen der höheren Strukturebenen: Das Protein entfaltet sich und verliert seine Funktion (<strong>Denaturierung</strong>). Die Primärstruktur bleibt erhalten. Meist ist der Vorgang nicht umkehrbar – Fieber über 42 °C ist deshalb lebensgefährlich.</p>'},
  kh:{t:'Kohlenhydrate', q:'Kartoffel, Papier, Zucker – was haben sie gemeinsam?', a:'<p><strong>Monosaccharide</strong> (Glucose, Fructose) verknüpfen sich unter Wasserabspaltung über <strong>glykosidische Bindungen</strong> zu <strong>Disacchariden</strong> (Saccharose = Glucose + Fructose) und <strong>Polysacchariden</strong>. Stärke (Kartoffel, Energiespeicher) und Cellulose (Papier, Baumwolle, Zellwand) bestehen beide aus Glucose – sie unterscheiden sich in der <strong>Art der Verknüpfung</strong>.</p>', fig:'carbs'},
  lipide:{t:'Fette & Fettsäuren', q:'Warum ist Butter fest, Olivenöl flüssig?', a:'<p>Fette bestehen aus <strong>Glycerin + drei Fettsäuren</strong>. Fettsäuren sind lange, <strong>unpolare</strong> Ketten – hydrophob. <strong>Gesättigte</strong> Fettsäuren sind gerade und lagern sich dicht zusammen (Butter: fest). <strong>Ungesättigte</strong> haben Doppelbindungen mit Knick, liegen lockerer (Öl: flüssig). Fette dienen als Langzeit-Energiespeicher.</p>', fig:'fat'},
  phospho:{t:'Phospholipide', q:'Wodurch unterscheidet sich ein Phospholipid von einem Fett?', a:'<p>Ein <strong>Phospholipid</strong> hat nur zwei Fettsäuren; statt der dritten trägt Glycerin eine <strong>Phosphatgruppe</strong> (oft mit geladenem Cholin). So entsteht ein <strong>hydrophiler Kopf</strong> und zwei <strong>hydrophobe Schwänze</strong>: Das Molekül ist <strong>amphiphil</strong> – der Grundbaustein jeder Biomembran.</p>', fig:'phospholipid'}
});

Object.assign(CARDS, {
  bilayer:{t:'Lipid-Doppelschicht', q:'Warum bilden Phospholipide in Wasser von selbst eine Doppelschicht?', a:'<p>Die hydrophilen Köpfe suchen Kontakt zum Wasser, die hydrophoben Schwänze weichen ihm aus. Da eine Membran zwei wässrige Räume trennt, lagern sich zwei Schichten <strong>Schwanz an Schwanz</strong> zusammen: Köpfe außen, Schwänze innen. Im Elektronenmikroskop erscheint das als <strong>zwei dunkle Linien um eine helle</strong>.</p>', fig:'em'},
  mproteine:{t:'Membranproteine', q:'Welche Arten von Membranproteinen gibt es?', a:'<p><strong>Integrale Proteine</strong> durchziehen die Lipidschicht (hydrophobe Bereiche innen, hydrophile ragen heraus), z. B. Kanäle, Carrier, Pumpen, Rezeptoren. <strong>Periphere Proteine</strong> liegen der Membran nur an. Membranproteine bestimmen, was eine Membran kann: Transport, Signalempfang, Erkennung.</p>'},
  fluid:{t:'Flüssig-Mosaik-Modell', q:'Warum „flüssig“ und warum „Mosaik“?', a:'<p>Nach <strong>Singer und Nicolson (1972)</strong> sind Proteine in die Lipid-Doppelschicht eingelagert und – wie Lipide – <strong>seitlich beweglich</strong> („flüssig“). Von oben betrachtet ergibt sich ein veränderliches Muster aus Lipiden und Proteinen („Mosaik“). Heute ergänzt um <strong>Lipid-Rafts</strong>: kleine, festere Bereiche mit Cholesterin.</p>', fig:'mosaikM'},
  glykokalyx:{t:'Glykokalyx & Zell-Zell-Erkennung', q:'Woran erkennt das Immunsystem eine fremde Zelle?', a:'<p>Auf der Außenseite tragen Glykoproteine und Glykolipide Zuckerketten – die <strong>Glykokalyx</strong>. Ihr Muster ist wie ein <strong>Ausweis</strong>: Zellen erkennen einander, Immunzellen unterscheiden „eigen“ und „fremd“. Beispiel: Die <strong>Blutgruppen A, B, AB und 0</strong> unterscheiden sich in den Zuckerketten auf den roten Blutzellen.</p>'},
  signal:{t:'Prinzip der Signaltransduktion', q:'Wie kommt eine Botschaft in die Zelle, wenn der Bote draußen bleibt?', a:'<p>Viele Botenstoffe (z. B. Adrenalin, Insulin) sind hydrophil und können die Membran nicht durchqueren. Sie binden außen an einen <strong>spezifischen Rezeptor</strong> (Schlüssel-Schloss-Prinzip). Der Rezeptor ändert seine Form und löst innen eine Kette von Reaktionen aus – oft über einen zweiten Botenstoff (<strong>second messenger</strong>). Das Signal wird dabei verstärkt; am Ende steht eine <strong>Zellantwort</strong>, z. B. Glykogenabbau.</p>'},
  gorter:{t:'Versuch von Gorter & Grendel', q:'Wie bewies man 1925, dass die Membran doppelt ist?', a:'<p>Lipide aus den Membranen roter Blutzellen wurden auf Wasser ausgebreitet. Der Lipidfilm war <strong>etwa doppelt so groß</strong> wie die Oberfläche aller Zellen (≈ 2827 mm² zu 1508 mm²). Folgerung: Die Lipide umgeben jede Zelle in <strong>zwei Schichten</strong> – das Bilayer-Modell.</p>', fig:'gorter'},
  modell:{t:'Was ist ein Modell?', q:'Warum gibt es mehrere Membranmodelle?', a:'<p>Ein Modell bildet die Wirklichkeit <strong>vereinfacht</strong> ab und zeigt ausgewählte Aspekte. Es ist <strong>vorläufig</strong>: Passen neue Befunde nicht dazu, wird es verändert oder verworfen. So folgten aufeinander: Bilayer (1925) → Sandwich (1935) → Flüssig-Mosaik (1972) → Lipid-Rafts (heute).</p>'}
});

     hilfen:['Erst das einzelne Molekül, dann viele Moleküle in Wasser.','Glycerin + Phosphat (+ Cholin) = Kopf; zwei Fettsäuren = Schwänze. In Wasser: Schwanz an Schwanz.','Satzanfänge: „Ein Phospholipid besteht aus …“ – „Der Kopf ist …“ – „In der Membran lagern sich …“'],
     model:'Ein Phospholipid besteht aus Glycerin, an das zwei Fettsäuren und eine Phosphatgruppe gebunden sind; an das Phosphat kann ein weiteres, geladenes Molekül wie Cholin gebunden sein. Glycerin, Phosphat und Cholin bilden den polaren, hydrophilen Kopf, die Fettsäuren die unpolaren, hydrophoben Schwänze – das Molekül ist bipolar. In der Membran lagern sich Phospholipide zu einer Doppelschicht zusammen: Die hydrophilen Köpfe zeigen nach außen zum wässrigen Außenmedium bzw. zum Cytoplasma, die hydrophoben Schwänze liegen innen, vom Wasser abgeschirmt.'},

    {op:'Erläutern', afb:'II', p:4, q:'Erläutern Sie das Prinzip der Signaltransduktion am Beispiel des Hormons Adrenalin, das in Leberzellen den Abbau von Glykogen zu Glucose auslöst.',

  diffusion:{t:'Diffusion', q:'Warum riecht man Parfum quer durch den Raum?', a:'<p>Teilchen bewegen sich ständig ungerichtet (<strong>Brownsche Molekularbewegung</strong>). Bei einem <strong>Konzentrationsgefälle</strong> verteilen sie sich dadurch netto vom Ort hoher zum Ort niedriger Konzentration, bis zum <strong>Konzentrationsausgleich</strong>. Wärme beschleunigt die Diffusion. Im Gleichgewicht bewegen sich die Teilchen weiter – nur ohne Netto-Richtung.</p>', fig:'kmno4'},
  osmose:{t:'Osmose', q:'Was ist das Besondere an der Osmose?', a:'<p><strong>Osmose</strong> ist die Diffusion von Wasser durch eine <strong>semipermeable</strong> Membran, die für Wasser, aber nicht für bestimmte gelöste Teilchen durchlässig ist. Wasser strömt netto zur Seite mit der <strong>höheren Konzentration gelöster Teilchen</strong>.</p>', fig:'utube'},
  tonie:{t:'hypo – iso – hyper', q:'Was bedeutet hypertonisch?', a:'<p>Man vergleicht immer zwei Lösungen: <strong>hypertonisch</strong> = mehr gelöste Teilchen, <strong>hypotonisch</strong> = weniger, <strong>isotonisch</strong> = gleich viele. Rote Blutzellen platzen in destilliertem Wasser (hypotonisch) und schrumpfen in Salzlösung (hypertonisch). Infusionen sind daher isotonisch (0,9 % Kochsalz).</p>', fig:'tonicity'},
  plasmolyse:{t:'Plasmolyse', q:'Was passiert mit Zwiebelzellen in Zuckerlösung?', a:'<p>In hypertonischer Lösung verliert die Vakuole Wasser; der Protoplast schrumpft und löst sich von der Zellwand: <strong>Plasmolyse</strong>. In Wasser kehrt sich das um (<strong>Deplasmolyse</strong>). Bei der <strong>Grenzplasmolyse</strong> (etwa 50 % der Zellen plasmolysiert) ist die Außenlösung etwa so konzentriert wie der Zellsaft.</p>'},
  variablen:{t:'Variablen im Experiment', q:'Was muss man bei einem fairen Versuch beachten?', a:'<p><strong>Unabhängige Variable:</strong> das, was du gezielt veränderst (z. B. Konzentration). <strong>Abhängige Variable:</strong> das, was du misst (z. B. Anteil plasmolysierter Zellen). <strong>Kontrollvariablen:</strong> alles andere bleibt gleich (Zeit, Temperatur, Zwiebelart, Präparatstelle). Nur so lässt sich die Wirkung eindeutig zuordnen.</p>'}

Object.assign(CARDS, {
  einfach:{t:'Einfache Diffusion', q:'Welche Stoffe schlüpfen einfach durch die Lipidschicht?', a:'<p>Kleine, <strong>unpolare</strong> Moleküle wie <strong>O₂</strong> und <strong>CO₂</strong> (und in geringem Maß Wasser) diffundieren direkt durch die Lipid-Doppelschicht – <strong>passiv</strong>, mit dem Konzentrationsgefälle, ohne Protein. Die Transportrate steigt <strong>proportional</strong> zum Konzentrationsunterschied – ohne Sättigung.</p>'},
  erleichtert:{t:'Erleichterte Diffusion', q:'Wie kommen Ionen und Glucose durch die Membran, ohne Energie zu verbrauchen?', a:'<p>Geladene oder größere polare Teilchen brauchen <strong>Transportproteine</strong> – aber keine Energie, solange sie mit dem Gefälle wandern. <strong>Kanalproteine</strong> bilden wassergefüllte Poren (z. B. <strong>Aquaporine</strong> für Wasser, Kaliumkanäle), oft öffnen und schließen sie (gesteuert). <strong>Carrier</strong> binden ihr Substrat und ändern ihre Form (z. B. Glucose-Transporter GLUT). Carrier können <strong>gesättigt</strong> sein, wenn alle besetzt sind.</p>'},
  aktiv:{t:'Aktiver Transport', q:'Wie kann eine Zelle Stoffe GEGEN das Gefälle pumpen?', a:'<p>Transport gegen das Konzentrationsgefälle braucht <strong>Energie</strong>. <strong>Primär aktiv:</strong> Eine Pumpe nutzt direkt <strong>ATP</strong>, z. B. die <strong>Natrium-Kalium-Pumpe</strong>: pro ATP 3 Na⁺ hinaus, 2 K⁺ hinein. <strong>Sekundär aktiv:</strong> Ein Carrier nutzt das Na⁺-Gefälle, das die Pumpe aufgebaut hat, z. B. der <strong>Na⁺-Glucose-Symport</strong> im Dünndarm.</p>'},
  porte:{t:'Uniport, Symport, Antiport', q:'Wie viele Teilchen nimmt ein Carrier mit – und wohin?', a:'<p><strong>Uniport:</strong> ein Stoff in eine Richtung (GLUT). <strong>Symport:</strong> zwei Stoffe in dieselbe Richtung (Na⁺ + Glucose). <strong>Antiport:</strong> zwei Stoffe in entgegengesetzte Richtungen (Na⁺-K⁺-Pumpe).</p>'},
  cytose:{t:'Endo- und Exocytose', q:'Wie nimmt eine Fresszelle ein ganzes Bakterium auf?', a:'<p>Für große Partikel stülpt sich die Membran ein und schnürt ein Vesikel ab: <strong>Endocytose</strong> (Phagocytose: feste Partikel, z. B. Bakterien durch Makrophagen; Pinocytose: Flüssigkeit). Bei der <strong>Exocytose</strong> verschmilzt ein Vesikel mit der Membran und gibt seinen Inhalt ab (z. B. Insulin, Neurotransmitter). Beides kostet Energie.</p>'},
  saettigung:{t:'Sättigungskurve', q:'Warum steigt die Aufnahme über Carrier nicht unbegrenzt?', a:'<p>Bei einfacher Diffusion wächst die Transportrate <strong>linear</strong> mit der Konzentration. Beim Carrier-Transport steigt sie zunächst steil, flacht dann ab und erreicht ein <strong>Maximum</strong>: Alle Carrier sind besetzt (<strong>Sättigung</strong>). Mehr Substrat bringt dann nichts mehr – nur mehr Carrier würden helfen.</p>', fig:'saturation'},
  muko:{t:'Mukoviszidose', q:'Was hat ein defekter Kanal mit zähem Schleim zu tun?', a:'<p>Bei der Erbkrankheit <strong>Mukoviszidose</strong> ist ein <strong>Chloridkanal</strong> (CFTR) defekt. Die Zellen der Atemwege geben zu wenig Cl⁻-Ionen nach außen ab; dadurch folgt auch zu wenig Wasser osmotisch nach. Der Schleim bleibt <strong>zäh</strong>, verstopft die Bronchien und begünstigt Infektionen.</p>'}
});

     hilfen:['Lege eine Tabelle an: drei Spalten (einfach, erleichtert, aktiv), Zeilen = Kriterien.','Kriterien: Energiebedarf? Richtung zum Gefälle? Transportprotein? Spezifität/Sättigung? Beispiel?','Satzanfänge: „Einfache und erleichterte Diffusion sind beide …“ – „Während …, benötigt aktiver Transport …“'],
     model:'Einfache und erleichterte Diffusion sind beide passiv: Sie verlaufen mit dem Konzentrationsgefälle und benötigen keine Energie. Bei der einfachen Diffusion durchqueren kleine, unpolare Moleküle wie O₂ und CO₂ direkt die Lipid-Doppelschicht; die Rate steigt linear mit dem Konzentrationsunterschied. Die erleichterte Diffusion nutzt spezifische Transportproteine – Kanäle (z. B. Aquaporine) oder Carrier (z. B. GLUT für Glucose) – und kann gesättigt werden. Im Gegensatz dazu befördert aktiver Transport Stoffe gegen das Konzentrationsgefälle und benötigt Energie, beim primär aktiven Transport direkt ATP (z. B. Na⁺-K⁺-Pumpe). Auch er ist protein-vermittelt, spezifisch und sättigbar.'},

     model:'Kurve A steigt linear: Je höher die Außenkonzentration, desto größer die Aufnahmerate – ohne Begrenzung. Das spricht für einfache Diffusion direkt durch die Lipid-Doppelschicht; Stoff A ist vermutlich klein und unpolar. Kurve B steigt zunächst steil, flacht dann ab und erreicht ein Maximum (Sättigung). Stoff B wird also über Transportproteine (Carrier) aufgenommen. Da die Zahl der Carrier begrenzt ist, sind ab einer bestimmten Konzentration alle besetzt; eine weitere Erhöhung steigert die Rate nicht mehr.'},

     hilfen:['Was wird transportiert, in welche Richtung, wie viele? Und warum geht das nicht „von allein“?','Innen wenig Na⁺/viel K⁺, außen umgekehrt. Pumpe: 3 Na⁺ raus, 2 K⁺ rein, ATP → Formänderung (Antiport).','Satzanfänge: „Die Pumpe bindet zunächst …“ – „Durch die Spaltung von ATP …“ – „Da beide Ionen gegen …“'],
     model:'Die Natrium-Kalium-Pumpe ist ein Transportprotein (Antiport). Sie bindet auf der Innenseite drei Na⁺-Ionen. Durch die Spaltung von ATP wird sie phosphoryliert und ändert ihre Form, sodass die Na⁺-Ionen nach außen abgegeben werden. Dann bindet sie außen zwei K⁺-Ionen; die Abspaltung des Phosphats lässt sie in ihre Ausgangsform zurückkehren und die K⁺-Ionen werden ins Zellinnere abgegeben. Da Na⁺ außen und K⁺ innen bereits höher konzentriert sind, erfolgt der Transport beider Ionen gegen ihr Konzentrationsgefälle – dafür ist Energie in Form von ATP nötig.'},
    {op:'Erklären', afb:'III', p:5, q:'Erklären Sie, warum die WHO bei Durchfall eine Trinklösung aus Salz und Zucker empfiehlt. Hinweis: Darmzellen nehmen Glucose über einen Na⁺-Glucose-Symporter auf.',

      {t:'sekundär aktiv: nutzt Na⁺-Gefälle (aufgebaut von der Na⁺-K⁺-Pumpe)', p:1, some:['sekundaer','gefaelle','gradient','pumpe'], min:2},
      {t:'Konzentration gelöster Teilchen in den Darmzellen/im Gewebe steigt', p:1, some:['konzentration','geloeste teilchen','hyperton','teilchen'], min:1},
      {t:'Wasser folgt osmotisch', p:1, all:[['wasser'],['osmo','folgt']]},
      {t:'ohne Zucker: weniger Na⁺- und damit Wasseraufnahme', p:1, some:['ohne zucker','reines wasser','weniger','nur wasser'], min:1}],
     hilfen:['Verknüpfe zwei Kapitel: Wie kommt Na⁺ mit Glucose in die Zelle? Was macht Wasser, wenn sich dort gelöste Teilchen sammeln?','Na⁺-Glucose-Symport (sekundär aktiv, nutzt das Na⁺-Gefälle der Pumpe) → mehr gelöste Teilchen in Zellen/Gewebe → Wasser folgt osmotisch.','Satzanfänge: „Die Darmzellen nehmen Glucose …“ – „Dadurch steigt …“ – „Wasser folgt …“ – „Reines Wasser …“'],
     model:'Darmzellen nehmen Glucose über einen Na⁺-Glucose-Symporter auf: Glucose und Na⁺ werden gemeinsam in die Zelle transportiert. Dieser Transport ist sekundär aktiv; er nutzt das Na⁺-Gefälle, das die Na⁺-K⁺-Pumpe unter ATP-Verbrauch aufbaut. Durch die Aufnahme von Na⁺ und Glucose steigt die Konzentration gelöster Teilchen in den Darmzellen und im Gewebe dahinter. Wasser folgt diesem Konzentrationsunterschied osmotisch und wird so vom Körper aufgenommen. Reines Wasser oder Salz allein wird schlechter aufgenommen, da ohne Glucose weniger Na⁺ über den Symporter in die Zellen gelangt.'},
    {op:'Erklären', afb:'III', p:4, q:'Bei Mukoviszidose ist ein Chloridkanal in den Zellen der Atemwege defekt. Erklären Sie, warum dadurch zäher Schleim entsteht.',
     crit:[
      {t:'normal: Cl⁻ wird über den Kanal nach außen abgegeben', p:1, all:[['chlorid','cl'],['aussen','abgegeben','hinaus','abgabe']]},
      {t:'defekt: zu wenig Cl⁻ außen', p:1, some:['zu wenig','weniger','kaum','nicht'], min:1},
      {t:'weniger gelöste Teilchen außen → weniger Wasser folgt osmotisch', p:1, all:[['wasser'],['osmo','folgt']]},
      {t:'Folge: wasserarmer, zäher Schleim (verstopft, Infektionen)', p:1, some:['zaeh','wasserarm','dickfluessig','verstopf','infektion'], min:1}],
     hilfen:['Was „zieht“ normalerweise Wasser in den Schleim? Was passiert, wenn das fehlt?','Kette: Cl⁻ nach außen → mehr gelöste Teilchen im Schleim → Wasser folgt osmotisch. Bei Defekt …','Satzanfänge: „Normalerweise geben die Zellen …“ – „Ist der Kanal defekt, …“ – „Dadurch folgt …“'],
     model:'Normalerweise geben die Zellen der Atemwege über den Chloridkanal Cl⁻-Ionen nach außen in die Schleimschicht ab. Dadurch steigt dort die Konzentration gelöster Teilchen, und Wasser folgt osmotisch – der Schleim bleibt dünnflüssig. Bei Mukoviszidose ist der Kanal defekt, es gelangen kaum Cl⁻-Ionen nach außen. Folglich strömt zu wenig Wasser nach, der Schleim wird wasserarm und zäh. Er verstopft die Bronchien und begünstigt Infektionen.'},
    {op:'Beschreiben', afb:'I', p:4, q:'Beschreiben Sie die Vorgänge der Endo- und Exocytose an je einem Beispiel.',
     crit:[
      {t:'Endocytose: Membran stülpt sich ein, Vesikel schnürt sich ab', p:1, all:[['endocytose','phagocytose'],['einstuelp','umfliesst','umschliesst','vesikel','abschnuer']]},
      {t:'Beispiel Endocytose (Fresszelle/Bakterium)', p:1, some:['fresszelle','makrophag','bakteri','phagocytose'], min:1},

     hilfen:['Endo = hinein, Exo = hinaus. Was macht die Membran jeweils?','Endocytose: einstülpen, abschnüren (Makrophage frisst Bakterium). Exocytose: Vesikel verschmilzt (Insulin ins Blut).','Satzanfänge: „Bei der Endocytose …“ – „Ein Beispiel ist …“ – „Bei der Exocytose hingegen …“'],
     model:'Bei der Endocytose stülpt sich die Zellmembran ein, umschließt einen Partikel oder Flüssigkeit und schnürt sich als Vesikel nach innen ab. Beispiel: Fresszellen (Makrophagen) nehmen Bakterien durch Phagocytose auf; das Vesikel verschmilzt dann mit einem Lysosom, dessen Enzyme das Bakterium abbauen. Bei der Exocytose verschmilzt ein Vesikel aus dem Golgi-Apparat mit der Zellmembran und gibt seinen Inhalt nach außen ab. Beispiel: Zellen der Bauchspeicheldrüse schütten so Insulin ins Blut aus.'}

    ichkann:['Ich kann passive und aktive Transportwege vergleichen.','Ich kann die Na⁺-K⁺-Pumpe und den Symport beschreiben.','Ich kann Sättigungskurven deuten.','Ich kann Transportvorgänge auf Krankheiten und Medizin übertragen.'] }
